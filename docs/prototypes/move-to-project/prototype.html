<!doctype html>
<!--
  PROTOTYPE, throwaway. Issue #2242 "Move a No project thread into a project".
  Question: how does a user move a No project thread into an existing project, or turn its folder into a new project?
  The clickable mock of the Mcode shell, with simulation switches for states that are hard to reach by hand.
  sitemap.html and flows.html link here as prototype.html#<preset>. State lives in memory; nothing talks to a server.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>#2242 Move to project · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css" />
<script src="shared.js"></script>
<style>
  /* ---------- The app mock ---------- */
  .app { position: relative; display: flex; height: 100%; min-height: 640px; background: var(--page); }
  .sb { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--page); border-right: 1px solid var(--border); }
  .sb-top { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; }
  .logo { display: flex; align-items: center; gap: 7px; font-weight: 700; }
  .logo .mark { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, oklch(55% 0.03 260), oklch(35% 0.03 260)); }
  .icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn.on { background: var(--selected); color: var(--ink); }
  .sb-search { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 6px; }
  .search-box { flex: 1; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--panel); color: var(--muted); }
  .sb-view { display: flex; align-items: center; justify-content: space-between; padding: 14px 6px 6px 8px; }
  .view-btn { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; padding: 4px 6px; border-radius: 6px; }
  .view-btn:hover { background: var(--hover); }
  .seg { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--panel); }
  .seg button { padding: 5px 12px; border-radius: 999px; color: var(--muted); }
  .seg button[aria-checked="true"] { background: var(--segment-on); box-shadow: 0 0 0 1px var(--segment-edge); color: var(--ink); font-weight: 500; }
  .sb-list { flex: 1; overflow-y: auto; padding: 2px 6px 12px; }
  .sb-foot { display: flex; gap: 6px; padding: 8px 8px 10px; color: var(--muted); }
  .grp-head { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px 0 6px; border-radius: 8px; position: relative; }
  .grp-head:hover { background: var(--hover); }
  .grp-head .name { flex: 1; min-width: 0; }
  .grp-head .acts { display: none; gap: 2px; }
  .grp-head:hover .acts, .grp-head:focus-within .acts { display: flex; }
  .chip { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; font: 700 8.5px/1 "Public Sans", sans-serif; flex-shrink: 0; }
  .chip.c1 { background: oklch(45% 0.09 175 / .35); color: oklch(80% 0.11 175); }
  .chip.c2 { background: oklch(45% 0.09 300 / .35); color: oklch(80% 0.11 300); }
  .chip.c3 { background: oklch(45% 0.09 40 / .35); color: oklch(80% 0.11 40); }
  [data-theme="light"] .chip.c1 { color: oklch(42% 0.11 175); } [data-theme="light"] .chip.c2 { color: oklch(42% 0.11 300); } [data-theme="light"] .chip.c3 { color: oklch(42% 0.11 40); }
  .chip.plain { background: transparent; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 8px; border-radius: 8px; position: relative; cursor: pointer; }
  .row.indent { padding-left: 30px; }
  .row:hover { background: var(--hover); }
  .row[aria-current="true"] { background: var(--selected); }
  .row .title { flex: 1; min-width: 0; }
  .row .meta { color: var(--muted); font-size: 11.5px; flex-shrink: 0; }
  .row .more { display: none; }
  .row:hover .more, .row:focus-within .more, .row .more.open { display: inline-grid; }
  .row:hover .meta { display: none; }
  .lane { width: 14px; display: inline-grid; place-items: center; flex-shrink: 0; }
  .spin { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid var(--muted); border-top-color: transparent; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; border-top-color: var(--muted); opacity: .6; } }
  .empty-line { padding: 2px 0 6px 30px; color: var(--muted); font-size: 12px; }
  .empty-line.flat { padding-left: 8px; }
  .link { color: var(--link); }
  .link:hover { text-decoration: underline; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--background); position: relative; }
  .hdr { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; }
  .crumb { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--panel); font-weight: 500; max-width: 520px; min-width: 0; }
  .crumb .sep { color: var(--muted); }
  .crumb .muted { color: var(--muted); font-weight: 400; }
  .hdr .right { margin-left: auto; display: flex; gap: 4px; }
  .composer-wrap { width: 100%; max-width: 760px; position: relative; }
  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 7px 7px 7px 10px; border-radius: 24px; background: var(--panel); }
  .composer textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 15px/1.45 "Public Sans", sans-serif; padding: 7px 4px; min-height: 34px; max-height: 160px; }
  .composer textarea::placeholder { color: var(--muted); }
  .model { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 999px; background: var(--page); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  [data-theme="light"] .model { background: var(--background); box-shadow: 0 0 0 1px var(--border); }
  .model .lvl { color: var(--muted); font-weight: 400; }
  .send { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--selected); color: var(--muted); flex-shrink: 0; }
  .send.ready { background: var(--primary); color: var(--on-primary); }
  /* The app's Button (components/ui/button.tsx): compact size, a variant per role, pressed as a 2px inset ring in the
     variant's ink, focus as a 2px ring 2px outside. Ghost has no resting fill, so it presses with the selected fill. */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 8px;
    border: 1px solid transparent; font-weight: 500; white-space: nowrap; transition: background-color .12s ease, color .12s ease; }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
  .btn .i { width: 14px; height: 14px; }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.primary:active { background: var(--primary-hover); box-shadow: inset 0 0 0 2px var(--on-primary); }
  .btn.outline { background: var(--background); border-color: var(--control-border); color: var(--ink); }
  .btn.outline:hover { background: var(--hover); }
  .btn.outline:active { background: var(--selected); box-shadow: inset 0 0 0 2px var(--ink); }
  .btn.ghost { color: var(--ink); }
  .btn.ghost:hover { background: var(--hover); }
  .btn.ghost:active { background: var(--selected); }
  .btn.sm { height: 24px; padding: 0 8px; gap: 5px; font-size: 12px; color: var(--muted); }
  .btn.sm .i { width: 13px; height: 13px; }
  .btn.sm:hover, .btn.outline.sm { color: var(--ink); }

  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 32px 12px; }
  .col-rail { max-width: 720px; margin: 0 auto; }
  .u-msg { background: var(--panel); border-radius: 14px; padding: 10px 14px; margin: 10px 0 18px; white-space: pre-wrap; }
  .a-prose { font-size: 14px; line-height: 1.6; margin: 0 0 10px; }
  .tool { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; margin: 6px 0 12px; }
  .tool code { color: var(--ink); background: var(--panel); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  .footer-line { color: var(--muted); font-size: 12px; margin: 8px 0 22px; }
  .running-line { display: flex; gap: 8px; align-items: center; color: var(--muted); margin: 4px 0 16px; }
  .bottom-composer { padding: 6px 32px 18px; }

  .ov { position: absolute; top: 50px; right: 12px; width: 336px; background: var(--raised); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 5; }
  .ov-sec + .ov-sec { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; }
  .ov-row { display: flex; align-items: center; gap: 9px; min-height: 32px; padding: 4px 8px; border-radius: 8px; }
  .ov-row:hover { background: var(--hover); }
  .ov-row .k { color: var(--muted); width: 74px; flex-shrink: 0; }
  .ov-row .v { flex: 1; min-width: 0; white-space: nowrap; }
  .ov-row .link { white-space: nowrap; }
  .ov-row .ico { color: var(--muted); }

  .pop { position: absolute; background: var(--raised); border-radius: 12px; box-shadow: var(--shadow); padding: 5px; z-index: 20; min-width: 220px; }
  .pop .search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .pop .search input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; }
  .pop .search input::placeholder, .palette .in input::placeholder { color: var(--muted); opacity: 1; }
  .mi { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 8px; border-radius: 7px; text-align: left; }
  .mi:hover, .mi.kb { background: var(--hover); }
  .mi .lab { flex: 1; min-width: 0; }
  .mi .hint { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .mi.danger { color: var(--error); }
  .mi[aria-disabled="true"] { color: var(--muted); }
  .mi .ico { color: var(--muted); }
  .mi.danger .ico { color: var(--error); }
  .mdiv { height: 1px; background: var(--border); margin: 4px 2px; }

  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 30; display: flex; justify-content: center; align-items: flex-start; }
  .palette { margin-top: 56px; width: 600px; max-width: calc(100% - 40px); background: var(--raised); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .palette .in { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-bottom: 1px solid var(--border); color: var(--muted); }
  .palette .in input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink); font: 400 14px "Public Sans", sans-serif; }
  .palette .body { max-height: 380px; overflow-y: auto; padding: 6px; }
  .palette .gh { color: var(--muted); font-size: 11.5px; padding: 8px 8px 4px; }
  .palette .foot { display: flex; gap: 14px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11.5px; }
  kbd { font: 500 10.5px/1 "JetBrains Mono", monospace; background: var(--selected); color: var(--ink); padding: 3px 5px; border-radius: 4px; }
  .dialog { margin-top: 140px; width: 440px; background: var(--raised); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; }
  .dialog h4 { margin: 0 0 8px; font-size: 15px; }
  .dialog p { margin: 0 0 6px; color: var(--muted); }

  /* ---------- #2242 Move to project ---------- */
  .crumb .title-btn { display: inline-flex; align-items: center; gap: 4px; min-width: 0; border-radius: 6px; padding: 0 2px; }
  .crumb .title-btn:hover { color: var(--ink); background: var(--hover); }
  .crumb .title-btn .ico { color: var(--muted); }
  .row.dragging { color: var(--muted); outline: 1px dashed var(--muted); outline-offset: -1px; }
  .grp-head.drop-over { background: var(--selected); box-shadow: inset 0 0 0 1.5px var(--primary); }
  .grp-head .drop-hint { display: none; color: var(--muted); font-size: 11.5px; padding-right: 6px; }
  .grp-head.drop-over .drop-hint { display: inline; }
  .grp-head.drop-over .acts { display: none; }
  /* The prototype draws the app at about 0.8 scale (13px body), so the app's 16/14/12px type roles read as 13/12/11.5px here. */
  .dialog.move { margin: auto 0; width: 500px; max-width: calc(100% - 32px); padding: 0; display: flex; flex-direction: column; max-height: calc(100% - 48px); position: relative; }
  /* Centred like the composer's ProjectSlotHeading. The thread being moved comes first as context, then the question.
     Equal side padding leaves room for the close button and keeps the centring true. */
  .move .head { padding: 22px 48px 0; display: grid; justify-items: center; gap: 8px; text-align: center; }
  .move .head .what { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; color: var(--muted); font-size: 12px; }
  .move .head h4 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
  .move .head .who { color: var(--muted); font-size: 12px; margin: 0; }
  .move .x { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
  .move .x:hover { background: var(--hover); color: var(--ink); }
  .move .x[disabled] { opacity: .5; pointer-events: none; }
  .move .body { padding: 16px 20px 20px; overflow-y: auto; display: grid; gap: 16px; border: 0; margin: 0; min-width: 0; }
  /* While a move runs the form is a disabled fieldset; controls dim the way the app's disabled controls do, notices stay readable. */
  .move .body:disabled :is(.tt, .text-in, .path-v, .check, .btn) { opacity: .5; cursor: default; }
  /* ProjectSlotHeading: the destination reads as part of the sentence, a dashed primary underline marks it as a choice. */
  .slot { color: var(--primary); border-bottom: 2px dashed var(--primary); line-height: 1.25; font-weight: 600; }
  .slot:hover { border-bottom-style: solid; }
  .slot[disabled] { opacity: .5; cursor: default; }
  /* NewThreadTargetRail: a tray with ghost compact triggers, Workspace on the left and the branch on the right. */
  .target { display: grid; gap: 6px; }
  .rail { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 3px 6px; border-radius: 12px; background: var(--panel); }
  [data-theme="light"] .rail { background: var(--page); }
  .rail .end { margin-left: auto; min-width: 0; display: flex; }
  .tt { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 8px; color: var(--muted); font-weight: 500; min-width: 0; max-width: 100%; }
  .tt .mono { font-size: 12px; font-weight: 400; }
  .tt .chev { width: 12px; height: 12px; }
  .tt:not(.static):hover { background: var(--hover); color: var(--ink); }
  .tt.static { cursor: default; }
  /* The app's DialogFooter: a tinted strip under a hairline, actions on the right. */
  /* Before a project is picked there is nothing to show yet, so the heading sits straight on the footer. */
  .move .body:empty { display: none; }
  .move:has(.body:empty) .head { padding-bottom: 20px; }
  .move .foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border);
    background: color-mix(in oklch, var(--hover) 50%, transparent); border-radius: 0 0 14px 14px; }
  .field { display: grid; gap: 6px; }
  .field > .lab { color: var(--muted); font-size: 12px; font-weight: 500; }
  .field .err { color: var(--error); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  /* Fields follow the app's field surface: field fill, control-border edge, muted edge on hover. */
  .text-in, .path-row .path-v { height: 34px; padding: 0 10px; border-radius: 8px; background: var(--field); border: 1px solid var(--control-border); color: var(--ink); }
  .text-in:hover { border-color: var(--muted); }
  /* Inline code sits at the size and weight of the sentence around it. */
  .result .mono, .notice .mono, .mi .mono { font-size: 12px; font-weight: 400; }
  .text-in { width: 100%; outline: 0; font: inherit; }
  .text-in:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .path-row { display: flex; align-items: center; gap: 8px; }
  .path-row .btn { height: 34px; }
  .path-row .path-v { flex: 1; min-width: 0; display: flex; align-items: center; font-size: 12px; }
  [aria-invalid="true"]:is(.text-in, .path-v) { border-color: var(--error); }
  .result { font-size: 12px; color: var(--muted); }
  .result .mono { color: var(--ink); }
  .check { display: flex; align-items: center; gap: 9px; cursor: pointer; text-align: left; }
  .check .box { width: 16px; height: 16px; border-radius: 5px; border: 1px solid var(--control-border); background: var(--field); display: grid; place-items: center; flex-shrink: 0; }
  .check[aria-checked="true"] .box { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; height: 36px; padding: 0 8px; margin-top: 4px; border-top: 1px solid var(--border); border-radius: 0 0 7px 7px; }
  .switch-row:hover { background: var(--hover); }
  .switch { width: 30px; height: 17px; border-radius: 999px; border: 1px solid var(--control-border); background: var(--field); padding: 1px; flex-shrink: 0; }
  .switch .knob { display: block; width: 13px; height: 13px; border-radius: 999px; background: var(--muted); transition: transform .12s; }
  .switch-row[aria-checked="true"] .switch { background: var(--primary); border-color: var(--primary); }
  .switch-row[aria-checked="true"] .knob { transform: translateX(13px); background: var(--on-primary); }
  /* One notice for every message in the dialog, as the app's Notice: tone icon, title, detail under the title's column. */
  .notice { display: grid; gap: 6px; padding: 12px 13px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); }
  .notice .nh { display: flex; align-items: center; gap: 10px; min-height: 24px; }
  .notice .nh .ti { flex: 1; min-width: 0; font-weight: 500; }
  .notice .tone { flex-shrink: 0; }
  .notice.info .tone { color: var(--info); }
  .notice.warning .tone { color: var(--warning); }
  .notice.error .tone { color: var(--error); }
  .notice .disc { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); flex-shrink: 0; }
  .notice .disc:hover { background: var(--hover); color: var(--ink); }
  .notice .nd { padding-left: 26px; display: grid; gap: 8px; color: var(--muted); font-size: 12px; min-width: 0; }
  .notice .nd .k { color: var(--muted); }
  .notice .nd ul { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; color: var(--ink); }
  .notice .nd li { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .notice .raw { display: block; color: var(--ink); white-space: pre-wrap; word-break: break-all; }
  .notice .nowrap { white-space: nowrap; }
  .pop.in-dialog { position: absolute; z-index: 40; max-height: 300px; overflow-y: auto; }
  .pop.in-dialog.col { display: flex; flex-direction: column; overflow: hidden; }
  .pop.in-dialog.col .list { overflow-y: auto; min-height: 0; flex: 1; }
  .ptabs { display: flex; gap: 2px; padding: 0 4px 4px; }
  .ptabs button { padding: 4px 8px; border-radius: 6px; color: var(--muted); font-size: 12px; }
  .ptabs button:hover { color: var(--ink); }
  .ptabs button[aria-selected="true"] { background: var(--selected); color: var(--ink); }
  .pop .gl { color: var(--muted); font-size: 11.5px; font-weight: 500; padding: 6px 8px 4px; }
  .mi .tag { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
  .mi .sub { color: var(--muted); font-size: 12px; }
  .mi.two { height: auto; min-height: 38px; padding: 6px 8px; align-items: center; }
  .mi.two .lab { display: grid; gap: 1px; }
  .mi[aria-disabled="true"] .sub { color: var(--muted); }
  .btn[disabled] { opacity: .5; cursor: default; pointer-events: none; }
  .btn[aria-busy="true"] { cursor: progress; }
  .btn .spin { border-color: currentColor; border-top-color: transparent; }

  .ev { margin: 6px 0 18px; display: grid; gap: 6px; }
  .ev-line { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
  .ev-line::before, .ev-line::after { content: ""; height: 1px; flex: 1; background: var(--border); }
  .ev-line .mid { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .ev-line b { color: var(--ink); font-weight: 500; }
  .ev-card { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--panel); font-size: 12.5px; }
  .ev-card .top { display: flex; align-items: center; gap: 8px; }
  .ev-card .top .grow { flex: 1; min-width: 0; }
  .ev-card .muted { color: var(--muted); }
  .ev-card details summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; display: flex; align-items: center; gap: 4px; }
  .ev-card details summary::-webkit-details-marker { display: none; }
  .ev-card details[open] > summary > .i { transform: rotate(180deg); }
  .ev-card .ev-files { color: var(--ink); font-size: 12px; }
  .ev-card blockquote { margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--background); font-size: 12px; white-space: pre-wrap; }
  .path-line { display: block; margin: 4px 0; }
  .ev-card blockquote .mono { font-size: 12px; font-weight: 400; overflow-wrap: anywhere; }

  const active = S.screen.kind === "thread" && S.screen.id === t.id;
  return `<div class="row ${showOrigin ? "" : "indent"} ${S.drag?.tid === t.id ? "dragging" : ""}" role="link" tabindex="0" data-open="${t.id}" aria-current="${active}" ${canDrag(t) ? 'draggable="true"' : ""}>
    ${showOrigin ? originChip(t) : statusLane(t)}<span class="title fade">${esc(t.title)}</span>
    ${showOrigin ? statusLane(t) : ""}
    <span class="meta mono">${formatAge(t.ageMin)}</span>
    <button class="icon-btn more ${S.menuFor === t.id && S.overlay === "menu" ? "open" : ""}" data-menu="${t.id}" aria-label="Thread options for ${esc(t.title)}" style="width:24px;height:24px">${ic("more", "sm")}</button>
  </div>`;
}
function projectGroups() {
  return projects().map(p => {
    const list = threadsVisible().filter(t => t.projectId === p.id);
    const open = S.expanded[p.id];
    return `<div class="grp-head ${S.drag?.over === p.id ? "drop-over" : ""}" data-toggle="${p.id}" data-drop="${p.id}" role="button" tabindex="0" aria-expanded="${!!open}">
      <span style="color:var(--muted)">${ic(open ? "down" : "right", "sm")}</span><span class="chip ${p.c}">${p.chip}</span><span class="name fade">${esc(p.name)}</span>
      <span class="drop-hint">Move to project…</span><span class="acts"><button class="icon-btn" aria-label="New thread in ${esc(p.name)}" style="width:24px;height:24px">${ic("pen", "sm")}</button></span>
    </div>${open ? (list.length ? list.map(t => rowHtml(t)).join("") : `<div class="empty-line mono">No ${S.scope} threads</div>`) : ""}`;
  }).join("");
}
function noProjectGroup() {
  const list = threadsVisible().filter(t => t.projectId === null);
  if (!list.length) return "";
  const open = S.expanded.none;
  return `<div class="grp-head" data-toggle="none" role="button" tabindex="0" aria-expanded="${open}">
      <span style="color:var(--muted)">${ic(open ? "down" : "right", "sm")}</span><span class="chip plain">${ic("inbox", "sm")}</span><span class="name">No project</span>
    </div>${open ? list.map(t => rowHtml(t)).join("") : ""}`;
}
function renderSidebar() {
  const list = S.view === "threads" ? byRecency(threadsVisible()).map(t => rowHtml(t, { showOrigin: true })).join("") : noProjectGroup() + projectGroups();
  const scope = `<div class="seg" role="radiogroup" aria-label="Thread scope"><button role="radio" aria-checked="${S.scope === "open"}" data-scope="open">Open</button><button role="radio" aria-checked="${S.scope === "closed"}" data-scope="closed">Closed</button></div>`;
  return `<aside class="sb" aria-label="Sidebar">
    <div class="sb-top"><button class="icon-btn" aria-label="Collapse sidebar">${ic("panelLeft")}</button><span class="logo"><span class="mark"></span>Mcode</span><span style="flex:1"></span><button class="icon-btn" aria-label="Back">${ic("back")}</button><button class="icon-btn" aria-label="Forward">${ic("fwd")}</button></div>
    <div class="sb-search"><button class="search-box" data-act="palette">${ic("search", "sm")}Search</button>
      <button class="icon-btn" aria-label="Add project">${ic("folderPlus")}</button><button class="icon-btn" aria-label="New thread (Ctrl+N)">${ic("pen")}</button></div>
    <div class="sb-view"><button class="view-btn" data-act="cycleview">${S.view === "threads" ? "Threads" : "Projects"} ${ic("down", "sm")}</button>${scope}</div>
    <div class="sb-list">${list || `<div class="empty-line flat mono">No ${S.scope} threads</div>`}</div>
    <div class="sb-foot"><button class="icon-btn" aria-label="Settings">${ic("settings")}</button><button class="icon-btn" aria-label="Pull requests">${ic("pr")}</button><button class="icon-btn" aria-label="Notifications">${ic("bell")}</button></div>
  </aside>`;
}
function composer() {
  const ready = draft.trim().length > 0;
  return `<div class="composer-wrap"><div class="composer">
      <button class="icon-btn" aria-label="Add to composer">${ic("plus")}</button>
      <textarea rows="1" data-fk="composer" placeholder="Reply…" aria-label="Message"></textarea>
      <span class="model"><span style="color:var(--muted)">${ic("spark", "sm")}</span>Claude Opus 5.5 <span class="lvl">· High</span></span>
      <button class="send ${ready ? "ready" : ""}" data-act="send" aria-label="Send">${ic("up", "sm")}</button>
    </div></div>`;
}
function crumbOf(t) {
  const where = t.projectId === null ? `<span class="chip plain">${ic("inbox", "sm")}</span><span class="muted">No project</span>`
    : `<span class="chip ${project(t.projectId).c}">${project(t.projectId).chip}</span><span class="muted">${esc(project(t.projectId).name)}</span>`;
  return `${where}<span class="sep">›</span><button class="title-btn" data-hmenu="${t.id}" aria-haspopup="menu" aria-label="Thread options for ${esc(t.title)}"><span class="fade">${esc(t.title)}</span>${ic("down", "sm ico")}</button>`;
}
function renderMain() {
  const t = current();
  if (!t) return `<section class="main"></section>`;
  const header = `<div class="hdr"><span class="crumb">${crumbOf(t)}</span><span class="right"><button class="icon-btn ${S.ovOpen ? "on" : ""}" data-act="ov" aria-label="Overview">${ic("panelRight")}</button></span></div>`;
  const inFlight = t.status === "running" || t.status === "approval";
  const tail = t.status === "running" ? `<div class="running-line"><span class="spin"></span>Running</div>`
    : t.status === "approval" ? `<div class="running-line"><span style="color:var(--primary)">${ic("alert", "sm")}</span>Approval required</div>` : "";
  /* Each finished turn closes with its own footer, directly after its last assistant message; a move marker never sits between them. */
  const turnFooter = (i, msgs) => (msgs[i + 1]?.a === undefined && !(inFlight && i === msgs.length - 1) ? `<div class="footer-line mono">Worked for 9s</div>` : "");
  const body = `<div class="thread"><div class="col-rail">${t.messages.map((m, i, msgs) => m.ev ? moveMarker(m.ev)
    : m.u ? `<div class="u-msg">${esc(m.u)}</div>`
    : `<p class="a-prose">${esc(m.a)}</p>${m.tool ? `<div class="tool">${ic("terminal", "sm")}<code class="mono">${esc(m.tool)}</code></div>` : ""}${turnFooter(i, msgs)}`).join("")}
    ${tail}</div></div><div class="bottom-composer"><div class="col-rail" style="max-width:760px">${composer()}</div></div>`;
  return `<section class="main" aria-label="Conversation">${header}${body}${S.ovOpen ? overviewHtml(t) : ""}</section>`;
}

/* The move marker follows ProviderSwitchMarker: a quiet centred line. A move into an existing project with files adds a card. */
function handoffNote(ev) {
  /* The path gets its own line and breaks only after a slash, so a narrow window never splits a folder name. */
  const path = esc(ev.oldFolder).replaceAll("/", "/<wbr>");
  /* Another thread still works in the folder, so the agent copies and leaves the originals for it. */
  const after = ev.heldBy.length ? "Another thread still works in that folder, so copy what you need into this project and leave the originals in place."
    : `Mcode deletes that folder on ${DEADLINE}. Copy what you need into this project.`;
  return `Files from earlier in this thread are in<span class="mono path-line">${path}</span>${after}`;
}
/* The folder stays while another thread uses it; only the last thread out starts the 7 days. */
function keptLine(ev) {
  const files = plural(ev.files.length, "earlier file stays", "earlier files stay");
  if (!ev.heldBy.length) return `${files} in the old folder. Mcode deletes it on ${DEADLINE}.`;
  const who = ev.heldBy.length === 1 ? `“${esc(ev.heldBy[0])}”` : `${ev.heldBy.length} other threads`;
  return `${files} in the old folder. ${who} still ${ev.heldBy.length === 1 ? "uses" : "use"} it, so Mcode keeps it.`;
}
function moveMarker(ev) {
  const p = project(ev.to);
  const how = ev.kind === "new" ? `Created project <b>${esc(p.name)}</b>` : `Moved to <b>${esc(p.name)}</b> · ${MODE_LABEL[ev.mode]}${ev.mode === "newwt" ? ` from ${esc(ev.base)}` : ""}`;
  const line = `<div class="ev-line" role="note"><span class="mid">${ic("move", "sm")}${how}</span></div>`;
  if (ev.kind === "new" || !ev.files.length) return `<div class="ev">${line}</div>`;
  const gone = S.sim.expired && !ev.heldBy.length;
  const state = gone ? `<span class="state-pill ok">Sent</span>` : ev.sent ? `<span class="state-pill ok">Sent to the agent</span>` : `<span class="state-pill">Goes with the next turn</span>`;
  return `<div class="ev">${line}<div class="ev-card">
    <div class="top">${ic(gone ? "trash" : "clock", "sm")}<span class="grow">${gone
      ? `Mcode deleted the old folder on ${DEADLINE}.`
      : keptLine(ev)}</span>${gone ? "" : `<button class="btn ghost sm" data-copy="${esc(ev.oldFolder)}">${ic("copy", "sm")}Copy path</button>`}</div>
    ${gone ? `<div class="muted">Files that were in the old folder</div>` : ""}<div class="ev-files mono">${esc(ev.files.join("  ·  "))}</div>
    ${gone && !ev.sent ? "" : `<details><summary>${ic("down", "sm")}What the agent is told ${state}</summary><blockquote>${handoffNote(ev)}</blockquote></details>`}
  </div></div>`;
}
function moveEventOf(t) { return t.messages.map(m => m.ev).filter(Boolean).at(-1); }

function overviewHtml(t) {
  const rest = `<div class="ov-sec"><div class="ov-row">${ic("terminal", "sm ico")}<span class="k">Terminals</span><span class="v" style="color:var(--muted)">None</span></div>
      <div class="ov-row">${ic("globe", "sm ico")}<span class="k">Browser</span><span class="v" style="color:var(--muted)">No tabs</span></div></div>
    <div class="ov-sec"><div class="ov-row">${ic("gauge", "sm ico")}<span class="k">Usage</span><span class="v mono">12.4k tokens</span></div></div>`;
  if (t.projectId === null) return `<div class="ov" role="dialog" aria-label="Overview">
    <div class="ov-sec"><div class="ov-row">${ic("folder", "sm ico")}<span class="k">Folder</span><span class="v" style="color:var(--muted)">No project folder</span><button class="link" style="font-size:12px" data-copy="${esc(folderPath(t))}">Copy</button></div></div>${rest}</div>`;
  const p = project(t.projectId);
  const where = t.mode === "local" || !p.git
    ? `<div class="ov-row">${ic("laptop", "sm ico")}<span class="k">Local</span><span class="v mono fade">${esc(p.path)}</span></div>`
    : `<div class="ov-row">${ic("tree", "sm ico")}<span class="k">Worktree</span><span class="v mono fade">${esc(t.wtPath ?? p.path)}</span></div>`;
  const git = p.git ? `<div class="ov-row">${ic("branch", "sm ico")}<span class="k">Branch</span><span class="v mono fade">${esc(t.branch)}</span></div>
      <div class="ov-row">${ic("pr", "sm ico")}<span class="k">Pull request</span><span class="v" style="color:var(--muted)">None</span></div>` : "";
  return `<div class="ov" role="dialog" aria-label="Overview"><div class="ov-sec">${where}${git}</div>${rest}</div>`;
}

/* ============================== Menus and palette ============================== */
function menuHtml() {
  const t = S.threads.find(x => x.id === S.menuFor); if (!t) return "";
  const pos = S.menuXY ?? (() => { const r = document.querySelector(`[data-open="${t.id}"]`)?.getBoundingClientRect(); const a = document.getElementById("app")?.getBoundingClientRect(); return r && a ? { x: r.right - a.left - 24, y: r.top - a.top } : { x: 240, y: 300 }; })();
  const moveItem = t.projectId === null && !t.closed
    ? busyReason(t) ? `<button class="mi two" role="menuitem" aria-disabled="true">${ic("move", "sm ico")}<span class="lab"><span>Move to project…</span><span class="sub">${busyLine(t)}</span></span></button>`
      : `<button class="mi" role="menuitem" data-act="openmove">${ic("move", "sm ico")}<span class="lab">Move to project…</span></button>` : "";
  const closeReason = busyReason(t);
  const closeItem = t.closed ? `<button class="mi" role="menuitem">${ic("restore", "sm ico")}<span class="lab">Restore thread</span></button>`

    : `<button class="mi" role="menuitem">${ic("x", "sm ico")}<span class="lab">Close thread</span></button>`;
  return `<div class="pop" data-stop role="menu" aria-label="Thread options" style="left:${pos.x}px;top:${pos.y}px;width:272px">
    <button class="mi" role="menuitem">${ic("rename", "sm ico")}<span class="lab">Rename thread</span></button>
    ${moveItem}
    <button class="mi" role="menuitem">${ic("copy", "sm ico")}<span class="lab">Copy</span><span class="hint">Path, ID ›</span></button>
    <div class="mdiv"></div>${closeItem}
    <button class="mi danger" role="menuitem">${ic("trash", "sm ico")}<span class="lab">Delete thread</span></button>
  </div>`;
}
function paletteHtml() {
  const q = S.query.toLowerCase(), t = current();
  const cmds = [
    ...(t && t.projectId === null && !t.closed ? [{ id: "move", label: "Move thread to project…", icon: "move", hint: busyReason(t) ?? "" }] : []),

    <div class="body"><div class="gh">Commands</div>${cmds.map((c, i) => `<button class="mi ${i === 0 ? "kb" : ""}" data-cmd="${c.id}" ${c.hint ? 'aria-disabled="true"' : ""}>${ic(c.icon, "sm ico")}<span class="lab">${c.label}</span><span class="hint mono">${c.key ?? c.hint ?? ""}</span></button>`).join("")}</div>
    <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> Navigate</span><span><kbd>Enter</kbd> Select</span><span><kbd>Esc</kbd> Close</span></div>
  </div></div>`;
}

/* ============================== Move dialog ============================== */
function nameError(mv) {
  const name = mv.name.trim();
  if (!name) return { msg: "Enter a name.", silent: true };
  if (/[\\/:*?"<>|]/.test(name)) return { msg: "Use letters, numbers, dots, dashes or underscores." };
  if (projects().some(p => p.name === name)) return { msg: `A project named ${name} already exists. Choose another name.` };
  if (EXISTING_FOLDERS.includes(joinPath(mv.parent, name))) return { msg: `${joinPath(mv.parent, name)} already exists. Choose another name or location.` };
  return null;
}
/* Only the threads that move can block: the thread itself, plus the others in its folder when the folder becomes a project. */
function blockReason(mv, t) {
  const busy = mv.dest === "new" ? busySharer(t) : busyReason(t) && t;
  if (busy) return { busy };
  /* An unfilled field already says so (placeholder or error), so the footer adds no hint of its own. */
  if (mv.dest === "existing") return !mv.pid || (mv.mode === "existingwt" && !mv.wt) ? { incomplete: true } : null;
  return nameError(mv) ? { incomplete: true } : null;
}
/* The composer's ProjectChooser: search, names only, then a divider and the one way to make a project, as Add project
   sits there in the app. With no projects yet, the new-project row is the whole list. */
function projectPicker(mv) {
  const q = mv.pq.trim().toLowerCase();
  const all = projects(), rows = all.filter(p => p.name.includes(q));
  const list = !all.length ? "" : rows.length
    ? rows.map((p, i) => `<button class="mi ${i === 0 ? "kb" : ""}" role="option" aria-selected="${mv.dest === "existing" && mv.pid === p.id}" data-mvpick="${p.id}"><span class="chip ${p.c}">${p.chip}</span><span class="lab">${esc(p.name)}</span>${mv.dest === "existing" && mv.pid === p.id ? ic("check", "sm") : ""}</button>`).join("")
    : `<div style="padding:12px 8px;color:var(--muted)">No project matches “${esc(mv.pq)}”.</div>`;
  const newRow = `<button class="mi ${all.length ? "" : "kb"}" role="option" aria-selected="${mv.dest === "new"}" data-mvnew>${ic("plus", "sm ico")}<span class="lab">New project from this folder</span>${mv.dest === "new" ? ic("check", "sm") : all.length ? `<span class="hint">Keeps the files</span>` : ""}</button>`;
  return `<div class="pop in-dialog" data-stop role="listbox" aria-label="Projects" data-w="300">
    ${all.length ? `<div class="search">${ic("search", "sm")}<input data-fk="mvq" data-mvq placeholder="Search projects" value="${esc(mv.pq)}" /></div>${list}<div class="mdiv"></div>` : ""}${newRow}
  </div>`;
}
function listPicker(kind, items, width) {
  return `<div class="pop in-dialog" data-stop role="listbox" aria-label="${kind}" data-w="${width}">${items}</div>`;
}
/* The app's Notice: tone icon, title, then detail under the title's column. `more` waits behind the chevron, keyed by an
   S.mv flag; `action` comes last, after whatever the chevron shows. */
function notice({ tone, title, detail = "", more = "", openKey = "", action = "" }) {
  const open = !!(openKey && S.mv[openKey]);
  const disc = more ? `<button type="button" class="disc" data-mvopen="${openKey}" aria-expanded="${open}" aria-label="${open ? "Hide details" : "Show details"}">${ic(open ? "upChev" : "down", "sm")}</button>` : "";
  const body = detail + (open ? more : "") + action;
  return `<div class="notice ${tone}" role="${tone === "error" ? "alert" : "status"}"><div class="nh">${ic({ info: "info", warning: "warning", error: "alert" }[tone], "tone")}<span class="ti">${title}</span>${disc}</div>${body ? `<div class="nd">${body}</div>` : ""}</div>`;
}
const threadList = ts => `<ul>${ts.map(o => `<li><span class="fade">${esc(o.title)}</span>${o.closed ? `<span class="k">Closed</span>` : ""}${busyReason(o) ? statusLane(o) : ""}</li>`).join("")}</ul>`;
/* The new-thread target rail: Workspace on the left, the branch or worktree on the right, with the app's labels
   ("On main", "From #412"). The line under it says where the thread will run, which the triggers leave out. */
function targetRail(mv, p) {
  const tt = (picker, icon, label, mono = true) => `<button class="tt" data-mvpicker="${picker}" aria-haspopup="listbox">${ic(icon, "sm")}<span class="${mono ? "mono" : ""} fade">${label}</span>${ic("down", "sm chev")}</button>`;
  const fixed = (icon, label, mono = true) => `<span class="tt static">${ic(icon, "sm")}<span class="${mono ? "mono" : ""}">${label}</span></span>`;
  if (!p.git) return `<div class="target"><div class="rail">${fixed("laptop", "Local", false)}</div>
    <span class="result">${esc(p.name)} is not a git repo, so the thread runs in <span class="mono">${esc(p.path)}</span></span></div>`;
  const base = mv.base ?? p.branch, pr = mv.pr && p.prs.find(x => x.n === mv.pr);
  const slug = suggestedName(S.threads.find(x => x.id === mv.tid));
  /* Local runs in the project's own checkout, so its branch is shown, not switched. */
  const [end, result] = mv.mode === "local" ? [fixed("branch", `On ${esc(p.branch)}`), `Runs in <span class="mono">${esc(p.path)}</span>`]
    : mv.mode === "newwt" ? [tt("branch", pr ? "pr" : "branch", pr ? `From #${pr.n}` : `From ${esc(mv.origin ? `origin/${base}` : base)}`),
      pr ? `Checks out <span class="mono">${esc(pr.head)}</span> in a new worktree` : `New branch <span class="mono">mcode/${esc(slug)}</span> in a new worktree`]
    : [tt("worktree", "fork", mv.wt ? `On ${esc(mv.wt.branch)}` : "Choose a worktree", !!mv.wt), mv.wt ? `Runs in <span class="mono">${esc(mv.wt.path)}</span>` : ""];
  return `<div class="target"><div class="rail">${tt("runs", MODE_ICON[mv.mode], MODE_LABEL[mv.mode], false)}<span class="end">${end}</span></div>
    ${result ? `<span class="result">${result}</span>` : ""}</div>`;
}
/* The app's names-only Workspace menu: Local carries the project folder, as it does when starting a thread. */
function runsPicker(mv, p) {
  return listPicker("Runs in", `<div class="gl">Workspace</div>` + ["newwt", "existingwt", "local"].map(m => {
    const off = m === "existingwt" && !p.worktrees.length;
    const trail = m === "local" ? `<span class="hint mono fade">${esc(p.path)}</span>` : off ? `<span class="hint">None yet</span>` : "";
    return `<button class="mi" role="option" aria-selected="${mv.mode === m}" ${off ? 'aria-disabled="true"' : `data-mvmode="${m}"`}>${ic(MODE_ICON[m], "sm ico")}<span class="lab">${MODE_LABEL[m]}</span>${trail}${mv.mode === m ? ic("check", "sm") : ""}</button>`;
  }).join(""), 280);
}
/* The new-thread target picker: Branches and Pull requests tabs, text rows with a "current" tag, and Start from origin
   as a switch under the Branches list that keeps the picker open. Search and the switch stay put; only the rows scroll. */
function branchPicker(mv, p) {
  const base = mv.base ?? p.branch, q = mv.pq.trim().toLowerCase(), onPrs = mv.btab === "prs";
  const none = what => `<div style="padding:12px 8px;color:var(--muted)">No ${what} matches “${esc(mv.pq)}”.</div>`;
  const branchRows = p.branches.filter(b => b.includes(q)).map(b => `<button class="mi" role="option" aria-selected="${!mv.pr && base === b}" data-mvbase="${esc(b)}"><span class="lab mono fade">${esc(b)}</span>${b === p.branch ? `<span class="tag">current</span>` : p.worktrees.some(w => w.branch === b) ? `<span class="tag">worktree</span>` : ""}${!mv.pr && base === b ? ic("check", "sm") : ""}</button>`);
  const prRows = p.prs.filter(x => `${x.title} ${x.head} #${x.n}`.toLowerCase().includes(q)).map(x => `<button class="mi two" role="option" aria-selected="${mv.pr === x.n}" data-mvpr="${x.n}"><span class="lab"><span class="fade">${esc(x.title)}</span><span class="sub mono">#${x.n} · ${esc(x.head)}</span></span>${mv.pr === x.n ? ic("check", "sm") : ""}</button>`);
  const rows = onPrs ? prRows : branchRows;
  return `<div class="pop in-dialog col" data-stop role="dialog" aria-label="Start from" data-w="340">
    <div class="search">${ic("search", "sm")}<input data-fk="mvq" data-mvq placeholder="${onPrs ? "Search pull requests" : "Search branches"}" value="${esc(mv.pq)}" /></div>
    <div class="ptabs" role="tablist"><button role="tab" aria-selected="${!onPrs}" data-mvtab="branches">Branches</button><button role="tab" aria-selected="${onPrs}" data-mvtab="prs">Pull requests</button></div>
    <div class="list" role="listbox">${rows.length ? rows.join("") : none(onPrs ? "pull request" : "branch")}</div>
    ${onPrs ? "" : `<button class="switch-row" role="switch" aria-checked="${mv.origin}" data-mvflip="origin"><span>Start from origin</span><span class="switch"><span class="knob"></span></span></button>`}
  </div>`;
}
/* The user only needs to know the old files will be deleted, and when, so it is one line plus the way to keep them.
   It waits until a project is picked; before that the chooser's "Keeps the files" hint carries the difference. While
   another thread still uses the folder there is no date yet: Mcode deletes it 7 days after the last one leaves. */
function filesNotice(mv, t) {
  if (mv.dest !== "existing" || !mv.pid || !folderFiles(t).length) return "";
  const when = sharersOf(t).length > 1 ? "once no thread uses it" : `on&nbsp;${DEADLINE.replace(" ", "&nbsp;")}`;
  return notice({ tone: "warning", title: `Files in the old folder are deleted ${when}`,
    action: `<div><button type="button" class="btn outline sm" data-mvnew>${ic("folderPlus")}Keep them: make this folder a new project</button></div>` });
}
/* A new project takes the whole folder, so every thread working in it comes along. A busy one has its own notice. */
function sharersNotice(mv, t, busy) {
  const others = sharersOf(t).slice(1);
  if (mv.dest !== "new" || !others.length || (others.length === 1 && busy?.id === others[0].id)) return "";
  return notice({ tone: "info", detail: threadList(others),
    title: others.length === 1 ? "1 other thread works in this folder and moves with it" : `${others.length} other threads work in this folder and move with it` });
}
/* The composer's ProjectSlotHeading: the destination is a dashed slot in the sentence, and it opens the chooser. */
function slotHtml(mv, locked) {
  const label = mv.dest === "new" ? "a new project" : mv.pid ? esc(project(mv.pid).name) : "choose a project";
  return `<button class="slot ${mv.dest === "existing" && !mv.pid ? "ph" : ""}" data-mvpicker="project" aria-haspopup="listbox" aria-label="Destination: ${label}" ${locked ? "disabled" : ""}>${label}</button>`;
}
function moveDialogHtml() {
  const mv = S.mv, t = S.threads.find(x => x.id === mv.tid);
  const locked = mv.phase === "moving";
  const n = mv.dest === "new" ? sharersOf(t).length : 1;
  /* A failed move names what failed and what is left where; across drives the fix is another location, so that error sits under Location. */
  const cross = S.sim.crossDrive && mv.dest === "new" && mv.parent.includes("\\");
  const failed = mv.phase === "failed";
  const who = n > 1 ? "the threads are" : "the thread is";
  let outcome = "";
  if (failed) {
    const [lead, rest, details] = cross
      ? [`Drive ${esc(mv.parent.slice(0, 2))} is full, so the folder couldn't be copied there`, `Your files are still in the old folder and ${who} still in No project; Mcode removed the partial copy. Free up space on ${esc(mv.parent.slice(0, 2))} and try again, or choose another location.`, "ENOSPC: no space left on device, copyfile 'bench.db'"]
      : mv.dest === "existing"
        ? [n > 1 ? `Couldn't move the ${n} threads` : "Couldn't move the thread", `Mcode's database was busy, so nothing changed: ${who} still in No project and the files are untouched. Try again in a moment.`, "SQLITE_BUSY: database is locked (updating thread workspace)"]
        : [`Couldn't move the folder to ${esc(mv.parent)}`, `Nothing changed: ${who} still in No project. Close any app using files in the folder, then try again.`, "EBUSY: resource busy or locked, rename '…/2026-11-26-sqlite-wal-vs-rollback-7f3a'"];
    outcome = notice({ tone: "error", title: lead, detail: `<div>${rest}</div>`, more: `<span class="raw mono">${esc(details)}</span>`, openKey: "showRaw" });
  }
  let form;
  if (mv.dest === "existing") form = mv.pid ? targetRail(mv, project(mv.pid)) : "";
  else {
    const err = nameError(mv);
    const shownErr = err && !err.silent ? err : null;
    const target = joinPath(mv.parent, mv.name.trim() || "…");
    form = `<div class="field"><label class="lab" for="mvname">Name</label><input id="mvname" class="text-in" data-fk="mvname" data-mvname value="${esc(mv.name)}" placeholder="Project name" ${shownErr ? 'aria-invalid="true" aria-describedby="mvname-err"' : ""} spellcheck="false" />
        ${shownErr ? `<span class="err" id="mvname-err">${ic("alert", "sm")}${esc(shownErr.msg)}</span>` : ""}</div>
      <div class="field"><span class="lab">Location</span><div class="path-row"><span class="path-v mono fade" ${cross && failed ? 'aria-invalid="true"' : ""}>${esc(mv.parent)}</span><button class="btn outline" data-mvpicker="browse">${ic("folder")}Browse…</button></div>
        ${shownErr ? "" : `<span class="result">Moves the folder and its files to <span class="mono">${esc(target)}</span></span>`}</div>
      ${cross && failed ? outcome : ""}
      <button class="check" role="checkbox" aria-checked="${mv.git}" data-mvflip="git"><span class="box">${mv.git ? ic("check", "sm") : ""}</span><span>Start a git repo</span></button>`;
  }
  const block = blockReason(mv, t);
  /* Info, not warning: nothing is at risk, the move only waits. The files warning stays the one warning in the dialog. */
  const busyBox = block?.busy ? notice({ tone: "info",
    title: `“${esc(block.busy.title)}” ${block.busy.status === "running" ? "is running" : "needs approval"}`,
    detail: `<div>${block.busy.id === t.id ? "" : "It works in this folder, so it moves with the new project. "}${block.busy.status === "running" ? "You can move once it stops." : "You can move once you answer it."}</div>` }) : "";
  /* The project exists and the thread is in it, so Done is the next step; retrying git is optional. */
  if (mv.phase === "gitfailed") {
    const p = project(mv.createdId) ?? { name: mv.name, path: joinPath(mv.parent, mv.name) };
    return `<div class="scrim"><div class="dialog move" role="alertdialog" aria-labelledby="mvh" data-stop>
      <div class="head"><h4 id="mvh">Project created</h4><p class="who">“${esc(t.title)}” now runs in the ${esc(p.name)} project.</p></div>
      <button class="x" data-act="mvdone" aria-label="Close">${ic("x", "sm")}</button>
      <div class="body">${notice({ tone: "error", title: "Couldn't start a git repo",
        detail: `<div>Permission was denied in the project folder. The project works without git. Check you can write to <span class="mono nowrap">${esc(p.path)}</span>, then retry, or run git init later.</div>`,
        more: `<span class="raw mono">${esc(p.path)}\ngit: 'init' failed: unable to create '.git/index.lock': Permission denied</span>`, openKey: "showRaw" })}</div>
      <div class="foot"><button class="btn outline" data-act="mvgitretry">${ic("restore")}Retry git setup</button><button class="btn primary" data-act="mvdone">Done</button></div>
    </div></div>`;
  }
  const primaryLabel = locked ? (mv.dest === "new" && S.sim.crossDrive ? "Copying files…" : "Moving…")
    : failed ? "Try again"
    : mv.dest === "new" ? "Create project" : "Move thread";
  const primaryIcon = failed ? "restore" : mv.dest === "new" ? "folderPlus" : "move";
  const primaryAttrs = locked ? 'aria-busy="true" aria-disabled="true"'
    /* An open picker covers the notices under it, so the move waits until it closes. */
    : `data-act="mvgo" ${block || mv.picker ? "disabled" : ""}`;
  const picker = mv.picker === "project" ? projectPicker(mv)
    : mv.picker === "runs" ? runsPicker(mv, project(mv.pid))
    : mv.picker === "branch" ? branchPicker(mv, project(mv.pid))
    : mv.picker === "worktree" ? listPicker("Worktrees", project(mv.pid).worktrees.map((w, i) => `<button class="mi two" role="option" data-mvwt="${i}">${ic("fork", "sm ico")}<span class="lab"><span class="mono">${esc(w.branch)}</span><span class="sub mono">${esc(w.path)}</span></span>${mv.wt?.path === w.path ? ic("check", "sm") : ""}</button>`).join(""), 340)
    : mv.picker === "browse" ? listPicker("Folders", PARENTS.map(f => `<button class="mi two" role="option" data-mvparent="${esc(f.path)}">${ic("folder", "sm ico")}<span class="lab"><span class="mono">${esc(f.path)}</span>${f.note ? `<span class="sub">${esc(f.note)}</span>` : ""}</span>${mv.parent === f.path ? ic("check", "sm") : ""}</button>`).join(""), 300)
    : "";
  return `<div class="scrim" ${locked ? "" : 'data-act="mvcancel"'}><div class="dialog move" role="dialog" aria-modal="true" aria-labelledby="mvh" data-stop ${locked ? 'aria-busy="true"' : ""}>
    <div class="head"><span class="what">${ic("inbox", "sm")}<span class="fade">${esc(t.title)}</span></span><h4 id="mvh">Move to ${slotHtml(mv, locked)}</h4></div>
    <button class="x" ${locked ? "disabled" : 'data-act="mvcancel"'} aria-label="Close">${ic("x", "sm")}</button>
    <fieldset class="body" ${locked ? "disabled" : ""}>${form}${busyBox}${cross ? "" : outcome}${filesNotice(mv, t)}${sharersNotice(mv, t, block?.busy)}</fieldset>
    <div class="foot">
      <button class="btn outline" ${locked ? "disabled" : 'data-act="mvcancel"'}>Cancel</button>
      <button class="btn primary" ${primaryAttrs}>${locked ? `<span class="spin"></span>` : ic(primaryIcon)}${primaryLabel}</button></div>
    ${picker}
  </div></div>`;
}

function overlayHtml() {
  if (S.overlay === "menu") return menuHtml();
  if (S.overlay === "palette") return paletteHtml();
  if (S.overlay === "move" && S.mv) return moveDialogHtml();
  return "";
}

/* ============================== Move actions ============================== */
function applyExisting(mv) {
  const t = S.threads.find(x => x.id === mv.tid);
  const p = project(mv.pid);
  const oldFolder = folderPath(t), files = [...folderFiles(t)];
  /* Threads left in the folder keep it alive: Mcode deletes it 7 days after the last one leaves. */
  const heldBy = sharersOf(t).slice(1).map(o => o.title);
  const slug = suggestedName(t);
  const pr = mv.mode === "newwt" && mv.pr ? p.prs.find(x => x.n === mv.pr) : null;
  t.projectId = p.id; t.mode = p.git ? mv.mode : "local";
  t.branch = !p.git ? null : mv.mode === "local" ? p.branch : pr ? pr.head : mv.mode === "newwt" ? `mcode/${slug}` : mv.wt.branch;
  t.wtPath = mv.mode === "newwt" ? `~/src/mcode-wt/${slug}` : mv.mode === "existingwt" ? mv.wt.path : null;
  t.messages = [...t.messages, { ev: { kind: "existing", to: p.id, mode: t.mode, base: pr ? `#${pr.n}` : mv.base ?? p.branch, oldFolder, files, heldBy, sent: false } }];
  S.expanded = { ...S.expanded, [p.id]: true };
}
function applyNew(mv) {
  const lead = S.threads.find(x => x.id === mv.tid);
  const name = mv.name.trim();
  const id = "p" + S.nextId;
  const chip = name.split(/[-_. ]/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("") || name.slice(0, 2).toUpperCase();
  const p = { id, name, chip, c: "c2", path: joinPath(mv.parent, name), git: mv.git && !S.sim.failGit, branch: mv.git && !S.sim.failGit ? "main" : null, branches: ["main"], prs: [], worktrees: [] };
  S.added = [p, ...S.added];
  S.nextId += 1;
  for (const o of sharersOf(lead)) {
    o.projectId = id; o.mode = "local"; o.branch = p.branch; o.wtPath = null;
    o.messages = [...o.messages, { ev: { kind: "new", to: id, files: [] } }];
  }
  S.expanded = { ...S.expanded, [id]: true };
  return id;
}
function runMove() {
  const mv = S.mv;
  setMv({ phase: "moving", picker: null });
  setTimeout(() => {
    if (S.overlay !== "move") return;
    if (S.sim.failMove || (S.sim.crossDrive && mv.dest === "new" && mv.parent.includes("\\"))) return setMv({ phase: "failed" });
    if (mv.dest === "existing") { applyExisting(mv); return set({ overlay: null, mv: null }); }
    const id = applyNew(mv);
    if (mv.git && S.sim.failGit) return setMv({ phase: "gitfailed", createdId: id });
    set({ overlay: null, mv: null });
  }, 1300);
}
function openMove(tid, patch = {}) {
  const t = S.threads.find(x => x.id === tid);
  if (!t || t.projectId !== null || t.closed || busyReason(t)) return;
  set({ overlay: "move", mv: newMv(tid, patch), menuFor: null, query: "", drag: null });
}

/* ============================== Sim bar ============================== */
function renderBar() {
  const t = current();
  const sim = (k, label) => `<button class="opt" aria-pressed="${S.sim[k]}" data-sim="${k}">${label}</button>`;
  const sharerRunning = t && t.projectId === null && sharersOf(t).slice(1).some(o => o.status === "running");
  return `<div class="proto-bar" role="toolbar" aria-label="Sim">
    <span class="grp"><span class="lbl">Sim</span><button class="opt" aria-pressed="${S.hasProjects}" data-act="flipprojects">Has projects</button>
      <button class="opt" aria-pressed="${!!sharerRunning}" data-act="flipsharer" ${t && t.projectId === null && sharersOf(t).length > 1 ? "" : "disabled"}>Fork running</button>
      ${sim("failMove", "Fail move")}${sim("crossDrive", "D: fails")}${sim("failGit", "Fail git init")}${sim("expired", "7 days passed")}</span>
    <span class="sep"></span>
    <span class="state">${t ? `thread:${t.id} · ${t.projectId ?? "no-project"}` : "-"}${S.mv ? ` · move:${S.mv.dest}/${S.mv.phase}` : ""}</span>
  </div>`;
}

/* ============================== Events ============================== */
function send() {
  const text = draft.trim(); const t = current(); if (!text || !t) return;
  const ev = moveEventOf(t);
  const withNote = ev && ev.kind === "existing" && ev.files.length && !ev.sent && !(S.sim.expired && !ev.heldBy.length);
  if (withNote) for (const o of S.threads) { const e = moveEventOf(o); if (e && e.oldFolder === ev.oldFolder) e.sent = true; }
  t.messages.push({ u: text }); t.status = "running"; draft = ""; render();
  setTimeout(() => { t.messages.push(withNote ? { a: "Copied bench.ts and results.csv from the earlier folder into scripts/bench/, and added a bench script to package.json.", tool: "Copied 2 files · Edited package.json" } : { a: "Done." }); t.status = "idle"; render(); }, 1200);
}
let copiedTimer;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-sim],[data-open],[data-menu],[data-hmenu],[data-toggle],[data-scope],[data-cmd],[data-copy],[data-mvnew],[data-mvpicker],[data-mvpick],[data-mvmode],[data-mvflip],[data-mvopen],[data-mvtab],[data-mvpr],[data-mvbase],[data-mvwt],[data-mvparent],[data-stop]");
  if (!el) { if (S.overlay === "menu") set({ overlay: null, menuFor: null }); return; }
  const d = el.dataset;
  if (el.matches("[disabled],[aria-disabled='true']")) return;
  if (d.copy) { clearTimeout(copiedTimer); copiedTimer = setTimeout(() => set({ copied: null }), 1600); return set({ copied: "path" }); }
  if (d.mvnew !== undefined) return setMv({ dest: "new", picker: null });
  if (d.mvpicker) return setMv({ picker: S.mv.picker === d.mvpicker ? null : d.mvpicker, pq: "" });
  if (d.mvpick) return setMv({ dest: "existing", pid: d.mvpick, picker: null, mode: "local", base: project(d.mvpick).branch, pr: null, wt: null, origin: false });
  if (d.mvmode) return setMv({ mode: d.mvmode, picker: null });
  if (d.mvflip) return setMv({ [d.mvflip]: !S.mv[d.mvflip] });
  if (d.mvopen) return setMv({ [d.mvopen]: !S.mv[d.mvopen] });
  if (d.mvbase) return setMv({ base: d.mvbase, pr: null, picker: null });
  if (d.mvtab) return setMv({ btab: d.mvtab, pq: "" });
  if (d.mvpr) return setMv({ pr: +d.mvpr, picker: null });
  if (d.mvwt) return setMv({ wt: project(S.mv.pid).worktrees[+d.mvwt], picker: null });
  if (d.mvparent) return setMv({ parent: d.mvparent, picker: null, phase: "form" });
  if (d.stop !== undefined && !d.act) { if (S.mv?.picker && !e.target.closest(".pop")) setMv({ picker: null }); return; }
  if (d.sim) return set({ sim: { ...S.sim, [d.sim]: !S.sim[d.sim] } });
  if (d.hmenu) { e.stopPropagation(); const r = el.getBoundingClientRect(), a = document.getElementById("app").getBoundingClientRect(); return set({ overlay: S.overlay === "menu" ? null : "menu", menuFor: d.hmenu, menuXY: { x: r.left - a.left, y: r.bottom - a.top + 6 } }); }
  if (d.menu) { e.stopPropagation(); return set({ overlay: S.overlay === "menu" && S.menuFor === d.menu ? null : "menu", menuFor: d.menu, menuXY: null }); }
  if (d.open) return set({ screen: { kind: "thread", id: d.open }, overlay: null, ovOpen: false });
  if (d.toggle) return set({ expanded: { ...S.expanded, [d.toggle]: !S.expanded[d.toggle] } });
  if (d.scope) return set({ scope: d.scope });
  if (d.cmd) return d.cmd === "move" ? openMove(current().id) : set({ overlay: null });
  switch (d.act) {
    case "reset": draft = ""; history.replaceState(null, "", location.pathname); return set(initial());
    case "palette": return set({ overlay: "palette", query: "" });
    case "cycleview": return set({ view: S.view === "threads" ? "projects" : "threads" });
    case "send": return send();
    case "ov": return set({ ovOpen: !S.ovOpen });
    case "openmove": return openMove(S.menuFor);
    case "mvcancel": if (e.target !== el && el.classList.contains("scrim")) return; return set({ overlay: null, mv: null });
    case "mvgo": return runMove();
    case "mvdone": return set({ overlay: null, mv: null });
    case "mvgitretry": { const p = project(S.mv.createdId); p.git = true; p.branch = "main"; for (const o of S.threads) if (o.projectId === p.id) o.branch = "main"; return set({ overlay: null, mv: null }); }
    case "flipprojects": return set({ hasProjects: !S.hasProjects });
    case "flipsharer": { const t = current(); const o = sharersOf(t)[1]; o.status = o.status === "running" ? "idle" : "running"; return render(); }
    case "dismiss": if (e.target.closest("[data-stop]")) return; return set({ overlay: null });
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.fk === "composer") { draft = e.target.value; autosize(e.target); e.target.closest(".composer").querySelector(".send").classList.toggle("ready", !!draft.trim()); }
  if (e.target.dataset.pq !== undefined) set({ query: e.target.value });
  if (e.target.dataset.mvq !== undefined) setMv({ pq: e.target.value });
  if (e.target.dataset.mvname !== undefined) setMv({ name: e.target.value });
});
/* The browser opens the details itself; keep state in step so a re-render keeps it open. toggle does not bubble. */
document.addEventListener("keydown", e => {
  if (e.target.dataset.fk === "composer" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); return send(); }
  if (e.target.dataset.mvq !== undefined && e.key === "Enter") { e.preventDefault(); document.querySelector("[data-mvpick], [data-mvbase], [data-mvpr], [data-mvnew]")?.click(); return; }
  if (e.key === "Escape") {
    if (S.overlay === "move") { if (S.mv.phase === "moving" || S.mv.phase === "gitfailed") return; if (S.mv.picker) return setMv({ picker: null }); return set({ overlay: null, mv: null }); }
    if (S.overlay) return set({ overlay: null, query: "" });
    if (S.ovOpen) return set({ ovOpen: false });
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return set({ overlay: "palette", query: "" }); }
  if (e.key === "Enter" && S.overlay === "palette") { document.querySelector(".palette .mi:not([aria-disabled='true'])")?.click(); }
});
/* Drag feedback toggles classes in place: a re-render would remove the dragged row and cancel the drag. */
const dropTarget = e => {
  const head = e.target.closest?.("[data-drop]");
  const t = S.drag && S.threads.find(x => x.id === S.drag.tid);
  return head && t && !busyReason(t) ? head : null;
};
document.addEventListener("dragstart", e => {
  const row = e.target.closest?.("[draggable][data-open]");
  if (!row) return;
  S.drag = { tid: row.dataset.open };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", row.dataset.open);
  requestAnimationFrame(() => row.classList.add("dragging"));
});
document.addEventListener("dragover", e => {
  const head = dropTarget(e);
  document.querySelectorAll(".drop-over").forEach(h => h !== head && h.classList.remove("drop-over"));
  if (!head) return;
  e.preventDefault();
  head.classList.add("drop-over");
});
/* A drop never moves on its own: it opens the Move dialog with that project picked. */
document.addEventListener("drop", e => {
  const head = dropTarget(e);
  if (!head) return;
  e.preventDefault();
  openMove(S.drag.tid, { pid: head.dataset.drop, base: project(head.dataset.drop).branch });
});
document.addEventListener("dragend", () => {
  S.drag = null;
  document.querySelectorAll(".dragging, .drop-over").forEach(el => el.classList.remove("dragging", "drop-over"));
});
addEventListener("hashchange", () => goto(location.hash.slice(1)));
goto(location.hash.slice(1));
</script>
</body>
</html>
