<!doctype html>
<!--
  PROTOTYPE, throwaway. Issue #2242 "Move a No project thread into a project".
  Question: how does a user move a No project thread into an existing project, or turn its folder into a new project?
  One file: a site map, the flows, and a clickable mock of the Mcode shell with simulation switches
  for states that are hard to reach by hand. State lives in memory; nothing talks to a server.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>#2242 Move to project</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Tokens copied from the running app's computed values (apps/web/src/index.css). */
  :root, [data-theme="dark"] {
    --page: oklch(0% 0 0); --background: oklch(0% 0 0); --panel: oklch(13% 0.003 260);
    --raised: oklch(17% 0.003 260);
    --hover: color-mix(in oklch, oklch(95.5% 0.005 260) 5%, transparent);
    --selected: color-mix(in oklch, oklch(95.5% 0.005 260) 12%, transparent);
    --ink: oklch(95.5% 0.005 260); --muted: oklch(65% 0.005 260);
    --primary: oklch(72% 0.170 75); --on-primary: oklch(15% 0.02 75);
    --success: oklch(78% 0.130 145); --error: oklch(78% 0.130 25); --destructive: oklch(65% 0.200 25);
    --focus: oklch(62% 0.190 264); --border: oklch(19% 0.003 260); --link: oklch(70% 0.140 260);
    --segment-on: color-mix(in oklch, oklch(95.5% 0.005 260) 12%, transparent);
    --segment-edge: color-mix(in oklch, oklch(95.5% 0.005 260) 14%, transparent);
    --scrim: oklch(0% 0 0 / 0.55); --shadow: 0 12px 32px oklch(0% 0 0 / 0.6), 0 0 0 1px oklch(25% 0.003 260);
  }
  [data-theme="light"] {
    --page: oklch(95.5% 0.005 260); --background: oklch(99% 0.005 260); --panel: oklch(96.5% 0.005 260);
    --raised: oklch(99% 0.005 260);
    --hover: oklch(95.5% 0.005 260); --selected: oklch(90% 0.005 260);
    --ink: oklch(19% 0.005 260); --muted: oklch(47% 0.010 260);
    --primary: oklch(52% 0.170 75); --on-primary: oklch(99% 0.005 260);
    --success: oklch(52% 0.120 145); --error: oklch(52% 0.140 25); --destructive: oklch(57.7% 0.190 27.3);
    --focus: oklch(52% 0.170 264); --border: oklch(92.5% 0.005 260); --link: oklch(52% 0.140 260);
    --segment-on: oklch(99% 0.005 260); --segment-edge: oklch(0 0 0 / 0.08);
    --scrim: oklch(20% 0.005 260 / 0.25); --shadow: 0 12px 32px oklch(20% 0.01 260 / 0.14), 0 0 0 1px oklch(90% 0.005 260);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font: 400 13px/1.45 "Public Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-ligatures: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 6px; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  svg.i.sm { width: 14px; height: 14px; }
  /* The app fades only text that overflows; render() marks those with .over. */
  .fade { overflow: hidden; white-space: nowrap; }
  .fade.over { mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); }

  /* ---------- Prototype chrome (deliberately not Mcode styling) ---------- */
  .proto-top { position: fixed; inset: 0 0 auto 0; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 12px;
    background: #1b1b2e; color: #e8e8ff; font: 500 12px/1 system-ui, sans-serif; z-index: 50; border-bottom: 1px solid #2c2c4a; }
  .proto-top .tag { background: #ff5ac8; color: #1b1b2e; padding: 4px 7px; border-radius: 4px; font-weight: 700; letter-spacing: .04em; margin-right: 10px; }
  .proto-top .tab { padding: 8px 12px; border-radius: 6px; color: #b9b9e0; }
  .proto-top .tab[aria-selected="true"] { background: #33335a; color: #fff; }
  .proto-top .spacer { flex: 1; }
  .proto-top .ghost { padding: 7px 10px; border-radius: 6px; color: #b9b9e0; border: 1px solid #3a3a60; }
  .stage { position: fixed; inset: 44px 0 0 0; overflow: auto; }
  /* On the prototype tab the variant bar gets its own strip, so it never covers the composer. */
  body.on-app .stage { bottom: 52px; }

  .proto-bar { position: fixed; inset: auto 0 0 0; height: 52px; z-index: 60; display: flex; align-items: center; justify-content: safe center; gap: 10px;
    background: #1b1b2e; color: #e8e8ff; border-top: 1px solid #3a3a60; padding: 0 12px; font: 500 11.5px/1 system-ui, sans-serif; overflow-x: auto; white-space: nowrap; }
  .proto-bar .grp { display: flex; align-items: center; gap: 4px; }
  .proto-bar .lbl { color: #8f8fc0; margin-right: 2px; }
  .proto-bar .opt { padding: 6px 8px; border-radius: 6px; color: #c8c8ee; }
  .proto-bar .opt[aria-pressed="true"] { background: #ff5ac8; color: #1b1b2e; }
  .proto-bar .sep { width: 1px; align-self: stretch; background: #3a3a60; }
  .proto-bar .state { color: #8f8fc0; font: 400 11px/1.2 ui-monospace, monospace; }

  /* ---------- Doc tabs (site map, flows) ---------- */
  .doc { max-width: 1240px; margin: 0 auto; padding: 32px 32px 140px; }
  .doc h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  .doc h2 { font-size: 15px; margin: 32px 0 12px; }
  .doc p.lead { color: var(--muted); margin: 0 0 20px; max-width: 760px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 18px; color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font: 600 10px/1 system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; vertical-align: 1px; }
  .pill.new { background: oklch(72% 0.17 75 / .18); color: var(--primary); }
  .pill.chg { background: oklch(70% 0.14 260 / .18); color: var(--link); }
  .pill.hide { background: oklch(65% 0.005 260 / .18); color: var(--muted); }
  .map { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .col { background: var(--panel); border-radius: 12px; padding: 14px 14px 10px; }
  .col h3 { margin: 0 0 2px; font-size: 13px; }
  .col .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; }
  .tree, .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree ul { padding-left: 14px; border-left: 1px solid var(--border); margin: 2px 0 4px 5px; }
  .tree li { padding: 3px 0; }
  .tree .node { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .tree .note { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .tree .go { color: var(--link); font-size: 11.5px; }
  .tree .dim { color: var(--muted); }
  table.keep { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.keep th, table.keep td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.keep th { color: var(--muted); font-weight: 500; }
  .decided { margin: 0; padding: 0 0 0 20px; display: grid; gap: 6px; max-width: 900px; }

  .flows { display: grid; gap: 14px; }
  .flow { background: var(--panel); border-radius: 12px; padding: 14px; }
  .flow h3 { margin: 0 0 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .steps { display: flex; align-items: stretch; gap: 6px; overflow-x: auto; }
  .step { flex: 1 1 0; min-width: 170px; background: var(--background); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .step:hover { border-color: var(--muted); }
  .step .n { color: var(--muted); font-size: 11px; }
  .step .t { font-weight: 500; }
  .step .s { color: var(--muted); font-size: 11.5px; flex: 1; }
  .step .open { color: var(--link); font-size: 11.5px; }
  .arrow { align-self: center; color: var(--muted); }

  /* ---------- The app mock ---------- */
  .app { position: relative; display: flex; height: 100%; min-height: 640px; background: var(--page); }
  .sb { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--page); border-right: 1px solid var(--border); }
  .sb-top { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; }
  .logo { display: flex; align-items: center; gap: 7px; font-weight: 700; }
  .logo .mark { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, oklch(55% 0.03 260), oklch(35% 0.03 260)); }
  .icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn.on { background: var(--selected); color: var(--ink); }
  .sb-search { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 6px; }
  .search-box { flex: 1; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--panel); color: var(--muted); }
  .sb-view { display: flex; align-items: center; justify-content: space-between; padding: 14px 6px 6px 8px; }
  .view-btn { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; padding: 4px 6px; border-radius: 6px; }
  .view-btn:hover { background: var(--hover); }
  .seg { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--panel); }
  .seg button { padding: 5px 12px; border-radius: 999px; color: var(--muted); }
  .seg button[aria-checked="true"] { background: var(--segment-on); box-shadow: 0 0 0 1px var(--segment-edge); color: var(--ink); font-weight: 500; }
  .sb-list { flex: 1; overflow-y: auto; padding: 2px 6px 12px; }
  .sb-foot { display: flex; gap: 6px; padding: 8px 8px 10px; color: var(--muted); }
  .grp-head { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px 0 6px; border-radius: 8px; position: relative; }
  .grp-head:hover { background: var(--hover); }
  .grp-head .name { flex: 1; min-width: 0; }
  .grp-head .acts { display: none; gap: 2px; }
  .grp-head:hover .acts, .grp-head:focus-within .acts { display: flex; }
  .chip { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; font: 700 8.5px/1 "Public Sans", sans-serif; flex-shrink: 0; }
  .chip.c1 { background: oklch(45% 0.09 175 / .35); color: oklch(80% 0.11 175); }
  .chip.c2 { background: oklch(45% 0.09 300 / .35); color: oklch(80% 0.11 300); }
  .chip.c3 { background: oklch(45% 0.09 40 / .35); color: oklch(80% 0.11 40); }
  [data-theme="light"] .chip.c1 { color: oklch(42% 0.11 175); } [data-theme="light"] .chip.c2 { color: oklch(42% 0.11 300); } [data-theme="light"] .chip.c3 { color: oklch(42% 0.11 40); }
  .chip.plain { background: transparent; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 8px; border-radius: 8px; position: relative; cursor: pointer; }
  .row.indent { padding-left: 30px; }
  .row:hover { background: var(--hover); }
  .row[aria-current="true"] { background: var(--selected); }
  .row .title { flex: 1; min-width: 0; }
  .row .meta { color: var(--muted); font-size: 11.5px; flex-shrink: 0; }
  .row .more { display: none; }
  .row:hover .more, .row:focus-within .more, .row .more.open { display: inline-grid; }
  .row:hover .meta { display: none; }
  .lane { width: 14px; display: inline-grid; place-items: center; flex-shrink: 0; }
  .spin { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid var(--muted); border-top-color: transparent; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; border-top-color: var(--muted); opacity: .6; } }
  .empty-line { padding: 2px 0 6px 30px; color: var(--muted); font-size: 12px; }
  .empty-line.flat { padding-left: 8px; }
  .link { color: var(--link); }
  .link:hover { text-decoration: underline; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--background); position: relative; }
  .hdr { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; }
  .crumb { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--panel); font-weight: 500; max-width: 520px; min-width: 0; }
  .crumb .sep { color: var(--muted); }
  .crumb .muted { color: var(--muted); font-weight: 400; }
  .hdr .right { margin-left: auto; display: flex; gap: 4px; }
  .composer-wrap { width: 100%; max-width: 760px; position: relative; }
  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 7px 7px 7px 10px; border-radius: 24px; background: var(--panel); }
  .composer textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 15px/1.45 "Public Sans", sans-serif; padding: 7px 4px; min-height: 34px; max-height: 160px; }
  .composer textarea::placeholder { color: var(--muted); }
  .model { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 999px; background: var(--page); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  [data-theme="light"] .model { background: var(--background); box-shadow: 0 0 0 1px var(--border); }
  .model .lvl { color: var(--muted); font-weight: 400; }
  .send { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--selected); color: var(--muted); flex-shrink: 0; }
  .send.ready { background: var(--primary); color: var(--on-primary); }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; font-weight: 500; background: var(--selected); white-space: nowrap; }
  .btn:hover { filter: brightness(1.1); }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: var(--hover); }

  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 32px 12px; }
  .col-rail { max-width: 720px; margin: 0 auto; }
  .u-msg { background: var(--panel); border-radius: 14px; padding: 10px 14px; margin: 10px 0 18px; white-space: pre-wrap; }
  .a-prose { font-size: 14px; line-height: 1.6; margin: 0 0 10px; }
  .tool { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; margin: 6px 0 12px; }
  .tool code { color: var(--ink); background: var(--panel); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  .footer-line { color: var(--muted); font-size: 12px; margin: 8px 0 22px; }
  .running-line { display: flex; gap: 8px; align-items: center; color: var(--muted); margin: 4px 0 16px; }
  .bottom-composer { padding: 6px 32px 18px; }

  .ov { position: absolute; top: 50px; right: 12px; width: 336px; background: var(--raised); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 5; }
  .ov-sec + .ov-sec { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; }
  .ov-row { display: flex; align-items: center; gap: 9px; min-height: 32px; padding: 4px 8px; border-radius: 8px; }
  .ov-row:hover { background: var(--hover); }
  .ov-row .k { color: var(--muted); width: 74px; flex-shrink: 0; }
  .ov-row .v { flex: 1; min-width: 0; white-space: nowrap; }
  .ov-row .link { white-space: nowrap; }
  .ov-row .ico { color: var(--muted); }

  .pop { position: absolute; background: var(--raised); border-radius: 12px; box-shadow: var(--shadow); padding: 5px; z-index: 20; min-width: 220px; }
  .pop .search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .pop .search input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; }
  .mi { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 8px; border-radius: 7px; text-align: left; }
  .mi:hover, .mi.kb { background: var(--hover); }
  .mi .lab { flex: 1; min-width: 0; }
  .mi .hint { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .mi.danger { color: var(--error); }
  .mi[aria-disabled="true"] { color: var(--muted); }
  .mi .ico { color: var(--muted); }
  .mi.danger .ico { color: var(--error); }
  .mdiv { height: 1px; background: var(--border); margin: 4px 2px; }

  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 30; display: flex; justify-content: center; align-items: flex-start; }
  .palette { margin-top: 56px; width: 600px; max-width: calc(100% - 40px); background: var(--raised); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .palette .in { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-bottom: 1px solid var(--border); color: var(--muted); }
  .palette .in input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink); font: 400 14px "Public Sans", sans-serif; }
  .palette .body { max-height: 380px; overflow-y: auto; padding: 6px; }
  .palette .gh { color: var(--muted); font-size: 11.5px; padding: 8px 8px 4px; }
  .palette .foot { display: flex; gap: 14px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11.5px; }
  kbd { font: 500 10.5px/1 "JetBrains Mono", monospace; background: var(--selected); color: var(--ink); padding: 3px 5px; border-radius: 4px; }
  .dialog { margin-top: 140px; width: 440px; background: var(--raised); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; }
  .dialog h4 { margin: 0 0 8px; font-size: 15px; }
  .dialog p { margin: 0 0 6px; color: var(--muted); }

  /* ---------- #2242 Move to project ---------- */
  .crumb .title-btn { display: inline-flex; align-items: center; gap: 4px; min-width: 0; border-radius: 6px; padding: 0 2px; }
  .crumb .title-btn:hover { color: var(--ink); background: var(--hover); }
  .crumb .title-btn .ico { color: var(--muted); }
  .row.dragging { color: var(--muted); outline: 1px dashed var(--muted); outline-offset: -1px; }
  .grp-head.drop-over { background: var(--selected); box-shadow: inset 0 0 0 1.5px var(--primary); }
  .grp-head .drop-hint { display: none; color: var(--muted); font-size: 11.5px; padding-right: 6px; }
  .grp-head.drop-over .drop-hint { display: inline; }
  .grp-head.drop-over .acts { display: none; }
  .dialog.move { margin-top: 72px; width: 500px; max-width: calc(100% - 32px); padding: 0; display: flex; flex-direction: column; max-height: calc(100% - 96px); position: relative; }
  .move .head { padding: 18px 18px 0; }
  .move .head h4 { margin: 0; }
  .move .head .who { color: var(--muted); margin: 2px 0 0; }
  .move .body { padding: 14px 18px 4px; overflow-y: auto; display: grid; gap: 14px; border: 0; margin: 0; min-width: 0; }
  /* Input edges meet 3:1 against the dialog in both themes (WCAG non-text contrast). */
  .move { --field-edge: color-mix(in oklch, var(--muted) 70%, var(--raised)); }
  /* While a move runs the whole form is a disabled fieldset: controls go quiet, notices stay readable. */
  .move .body:disabled .seg button, .move .body:disabled .trigger, .move .body:disabled .text-in, .move .body:disabled .check, .move .body:disabled .btn, .move .body:disabled .link { color: var(--muted); cursor: default; }
  .move .body:disabled .seg button[aria-checked="true"] { background: var(--selected); box-shadow: none; }
  .path-line { display: block; margin: 4px 0; }
  .move .foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 18px 18px; }
  .field { display: grid; gap: 6px; }
  .field > .lab { color: var(--muted); font-size: 12px; font-weight: 500; }
  .field .help { color: var(--muted); font-size: 12px; }
  .field .err { color: var(--error); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .seg.wide { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-radius: 9px; }
  .seg.wide button { border-radius: 7px; padding: 6px 10px; text-align: center; }
  .seg.wide button[aria-disabled="true"] { color: var(--muted); opacity: .55; cursor: not-allowed; }
  .trigger { display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--field-edge); text-align: left; }
  .trigger:hover { background: var(--selected); }
  .trigger .lab { flex: 1; min-width: 0; }
  .trigger .ph { color: var(--muted); }
  .trigger .hint { color: var(--muted); font-size: 12px; }
  .inline-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
  .inline-row .trigger { width: auto; height: 28px; padding: 0 8px; font-size: 12.5px; color: var(--ink); }

  .inline-row .mono, .result .mono, .help .mono, .check .mono, .note-box .txt .mono { font-size: 12px; font-weight: 400; }

        <li><span class="node">New project</span><span class="note">The hidden workspace becomes the project, so the folder is not cleaned up.</span></li>
      </ul></div>
  </div>
  <h2>Decided</h2>
  <ol class="decided">
    <li>Both destinations ship in v1: an existing project, or a new project made from the folder.</li>
    <li>Mcode copies no files into an existing project. The old folder stays 7 days and the next turn's handoff tells the agent where it is. The note is enough.</li>
    <li>The user picks how the thread runs in an existing project during the move: Local, New worktree or Existing worktree.</li>
    <li>A new project is not a git repo unless the user ticks Start a git repo.</li>
    <li>For a new project, the hidden workspace becomes the project.</li>
    <li>Every thread sharing the folder (forks and children, open or closed) moves together.</li>
    <li>The move waits until no thread sharing the folder is Running or needs approval.</li>
    <li>In the Projects view, dragging a No project row onto a project opens the Move dialog with that project picked. A drop never moves the thread on its own.</li>

</div>`;

/* Presets: jump into the app at a specific state. */
function newMv(tid, patch = {}) {
  const t = S.threads.find(x => x.id === tid);
  return { tid, dest: projects().length ? "existing" : "new", pid: null, mode: "local", base: null, origin: false, wt: null,
    name: suggestedName(t), parent: defaultParent(), git: false, phase: "form", picker: null, pq: "", showFiles: false, ...patch };
}
function goto(key) {
  draft = "";
  S = { ...initial(), tab: "app", theme: S.theme };
  const at = (id, extra = {}) => ({ screen: { kind: "thread", id }, ...extra });
  const moved = (tid, pid, mode = "local") => { applyExisting(newMv(tid, { pid, mode, base: project(pid).branch })); };
  const presets = {
    headerMenu: () => set(at("n2", { overlay: "menu", menuFor: "n2", menuXY: { x: 330, y: 44 } })),
    rowMenu: () => set(at("n2", { overlay: "menu", menuFor: "n2", menuXY: null })),
    menuBusy: () => { S.threads.find(t => t.id === "f1").status = "running"; set(at("n1", { overlay: "menu", menuFor: "n1", menuXY: { x: 330, y: 44 } })); },
    paletteMove: () => set(at("n2", { overlay: "palette" })),
    dragOver: () => set(at("n2", { drag: { tid: "n2", over: "billing" } })),
    moveA: () => set(at("n2", { overlay: "move", mv: newMv("n2") })),
    moveAPicker: () => set(at("n2", { overlay: "move", mv: newMv("n2", { picker: "project" }) })),
    moveAPicked: () => set(at("n2", { overlay: "move", mv: newMv("n2", { pid: "billing", base: "main" }) })),
    moveAFiles: () => set(at("n1", { overlay: "move", mv: newMv("n1", { pid: "mcode", base: "main", showFiles: true }) })),
    moveNewWt: () => set(at("n1", { overlay: "move", mv: newMv("n1", { pid: "mcode", mode: "newwt", base: "main" }) })),
    moveExistingWt: () => set(at("n1", { overlay: "move", mv: newMv("n1", { pid: "mcode", mode: "existingwt", base: "main" }) })),
    moveNonGit: () => set(at("n2", { overlay: "move", mv: newMv("n2", { pid: "docs" }) })),
    moveB: () => set(at("n1", { overlay: "move", mv: newMv("n1", { dest: "new" }) })),
    moveBGit: () => set(at("n1", { overlay: "move", mv: newMv("n1", { dest: "new", git: true }) })),
    moveBCollide: () => set(at("n1", { overlay: "move", mv: newMv("n1", { dest: "new", name: "mcode" }) })),
    moveBusy: () => { S.threads.find(t => t.id === "f1").status = "running"; set(at("n1", { overlay: "move", mv: newMv("n1", { pid: "mcode", base: "main" }) })); },
    moveMoving: () => set(at("n1", { overlay: "move", mv: newMv("n1", { pid: "mcode", base: "main", phase: "moving" }) })),
    moveFailed: () => set(at("n1", { overlay: "move", mv: newMv("n1", { pid: "mcode", base: "main", phase: "failed" }) })),
    moveCross: () => set(at("n1", { overlay: "move", sim: { ...S.sim, crossDrive: true }, mv: newMv("n1", { dest: "new", parent: "D:\\work", phase: "failed" }) })),
    moveGitFail: () => {
      S.sim.failGit = true;
      const createdId = applyNew(newMv("n1", { dest: "new", git: true }));
      set(at("n1", { overlay: "move", mv: newMv("n1", { dest: "new", git: true, phase: "gitfailed", createdId }) }));
    },
    moveZero: () => { S.hasProjects = false; set(at("n1", { overlay: "move", mv: newMv("n1") })); },
    afterA: () => { moved("n2", "billing"); set(at("n2")); },
    afterAFiles: () => { moved("n1", "mcode"); set(at("n1")); },
    afterAOverview: () => { moved("n1", "mcode"); set(at("n1", { ovOpen: true })); },
    afterSent: () => { moved("n1", "mcode"); draft = "Copy the benchmark into the repo and wire it into bun run bench."; set(at("n1")); send(); },
    afterExpired: () => { moved("n1", "mcode"); set(at("n1", { sim: { ...S.sim, expired: true } })); },
    afterB: () => { applyNew(newMv("n1", { dest: "new" })); set(at("n1")); },
  };
  (presets[key] ?? (() => set({})))();
}

/* ============================== Tab 3: the app ============================== */
function renderApp() {

function statusLane(t) {

  if (t.status === "finished") return `<span class="lane" role="img" aria-label="Finished" style="color:var(--success)">${ic("check", "sm")}</span>`;
  return `<span class="lane"></span>`;
}
const originChip = t => (t.projectId ? `<span class="chip ${project(t.projectId).c}">${project(t.projectId).chip}</span>` : `<span class="chip plain">${ic("inbox", "sm")}</span>`);
/* Only the Projects view has project headers to drop on. */
const canDrag = t => S.view === "projects" && t.projectId === null && !t.closed;

  </div>`;
}
function projectGroups() {
  return projects().map(p => {
    const list = threadsVisible().filter(t => t.projectId === p.id);
    const open = S.expanded[p.id];
    return `<div class="grp-head ${S.drag?.over === p.id ? "drop-over" : ""}" data-toggle="${p.id}" data-drop="${p.id}" role="button" tabindex="0" aria-expanded="${!!open}">
      <span style="color:var(--muted)">${ic(open ? "down" : "right", "sm")}</span><span class="chip ${p.c}">${p.chip}</span><span class="name fade">${esc(p.name)}</span>
      <span class="drop-hint">Move to project…</span><span class="acts"><button class="icon-btn" aria-label="New thread in ${esc(p.name)}" style="width:24px;height:24px">${ic("pen", "sm")}</button></span>
    </div>${open ? (list.length ? list.map(t => rowHtml(t)).join("") : `<div class="empty-line mono">No ${S.scope} threads</div>`) : ""}`;

}
function noProjectGroup() {
  const list = threadsVisible().filter(t => t.projectId === null);
  if (!list.length) return "";
  const open = S.expanded.none;
  return `<div class="grp-head" data-toggle="none" role="button" tabindex="0" aria-expanded="${open}">
      <span style="color:var(--muted)">${ic(open ? "down" : "right", "sm")}</span><span class="chip plain">${ic("inbox", "sm")}</span><span class="name">No project</span>

function renderSidebar() {
  const list = S.view === "threads" ? byRecency(threadsVisible()).map(t => rowHtml(t, { showOrigin: true })).join("") : noProjectGroup() + projectGroups();
  const scope = `<div class="seg" role="radiogroup" aria-label="Thread scope"><button role="radio" aria-checked="${S.scope === "open"}" data-scope="open">Open</button><button role="radio" aria-checked="${S.scope === "closed"}" data-scope="closed">Closed</button></div>`;

    <div class="sb-search"><button class="search-box" data-act="palette">${ic("search", "sm")}Search</button>
      <button class="icon-btn" aria-label="Add project">${ic("folderPlus")}</button><button class="icon-btn" aria-label="New thread (Ctrl+N)">${ic("pen")}</button></div>
    <div class="sb-view"><button class="view-btn" data-act="cycleview">${S.view === "threads" ? "Threads" : "Projects"} ${ic("down", "sm")}</button>${scope}</div>

function composer() {
  const ready = draft.trim().length > 0;

      <span class="model"><span style="color:var(--muted)">${ic("spark", "sm")}</span>Claude Opus 5.5 <span class="lvl">· High</span></span>
      <button class="send ${ready ? "ready" : ""}" data-act="send" aria-label="Send">${ic("up", "sm")}</button>

function crumbOf(t) {
  const where = t.projectId === null ? `<span class="chip plain">${ic("inbox", "sm")}</span><span class="muted">No project</span>`
    : `<span class="chip ${project(t.projectId).c}">${project(t.projectId).chip}</span><span class="muted">${esc(project(t.projectId).name)}</span>`;
  return `${where}<span class="sep">›</span><button class="title-btn" data-hmenu="${t.id}" aria-haspopup="menu" aria-label="Thread options for ${esc(t.title)}"><span class="fade">${esc(t.title)}</span>${ic("down", "sm ico")}</button>`;
}
function renderMain() {
  const t = current();
  if (!t) return `<section class="main"></section>`;
  const header = `<div class="hdr"><span class="crumb">${crumbOf(t)}</span><span class="right"><button class="icon-btn ${S.ovOpen ? "on" : ""}" data-act="ov" aria-label="Overview">${ic("panelRight")}</button></span></div>`;
  const inFlight = t.status === "running" || t.status === "approval";
  const tail = t.status === "running" ? `<div class="running-line"><span class="spin"></span>Running</div>`
    : t.status === "approval" ? `<div class="running-line"><span style="color:var(--primary)">${ic("alert", "sm")}</span>Approval required</div>` : "";
  /* Each finished turn closes with its own footer, directly after its last assistant message; a move marker never sits between them. */
  const turnFooter = (i, msgs) => (msgs[i + 1]?.a === undefined && !(inFlight && i === msgs.length - 1) ? `<div class="footer-line mono">Worked for 9s</div>` : "");
  const body = `<div class="thread"><div class="col-rail">${t.messages.map((m, i, msgs) => m.ev ? moveMarker(m.ev)
    : m.u ? `<div class="u-msg">${esc(m.u)}</div>`
    : `<p class="a-prose">${esc(m.a)}</p>${m.tool ? `<div class="tool">${ic("terminal", "sm")}<code class="mono">${esc(m.tool)}</code></div>` : ""}${turnFooter(i, msgs)}`).join("")}
    ${tail}</div></div><div class="bottom-composer"><div class="col-rail" style="max-width:760px">${composer()}</div></div>`;
  return `<section class="main" aria-label="Conversation">${header}${body}${S.ovOpen ? overviewHtml(t) : ""}</section>`;
}

/* The move marker follows ProviderSwitchMarker: a quiet centred line. A move into an existing project with files adds a card. */
function handoffNote(ev) {
  /* The path gets its own line and breaks only after a slash, so a narrow window never splits a folder name. */
  const path = esc(ev.oldFolder).replaceAll("/", "/<wbr>");
  return `Files from earlier in this thread are in<span class="mono path-line">${path}</span>Mcode deletes that folder on ${DEADLINE}. Copy what you need into this project.`;
}
function moveMarker(ev) {
  const p = project(ev.to);
  const how = ev.kind === "new" ? `Made project <b>${esc(p.name)}</b>` : `Moved to <b>${esc(p.name)}</b> · ${MODE_LABEL[ev.mode]}${ev.mode === "newwt" ? ` from ${esc(ev.base)}` : ""}`;
  const line = `<div class="ev-line" role="note"><span class="mid">${ic("move", "sm")}${how}</span></div>`;
  if (ev.kind === "new" || !ev.files.length) return `<div class="ev">${line}</div>`;
  const gone = S.sim.expired;
  const state = gone ? `<span class="state-pill ok">Sent</span>` : ev.sent ? `<span class="state-pill ok">Sent with the next turn</span>` : `<span class="state-pill">Goes with the next turn</span>`;
  return `<div class="ev">${line}<div class="ev-card">
    <div class="top">${ic(gone ? "trash" : "clock", "sm")}<span class="grow">${gone
      ? `Mcode deleted the old folder on ${DEADLINE}.`
      : `${plural(ev.files.length, "earlier file stays", "earlier files stay")} in the old folder. Mcode deletes it on ${DEADLINE}.`}</span>${gone ? "" : `<button class="link" data-copy="${esc(ev.oldFolder)}">Copy path</button>`}</div>
    <div class="ev-files mono">${esc(ev.files.join("  ·  "))}</div>
    ${gone && !ev.sent ? "" : `<details><summary>What the agent is told ${state}</summary><blockquote>${handoffNote(ev)}</blockquote></details>`}
  </div></div>`;
}
function moveEventOf(t) { return t.messages.map(m => m.ev).filter(Boolean).at(-1); }

function overviewHtml(t) {
  const rest = `<div class="ov-sec"><div class="ov-row">${ic("terminal", "sm ico")}<span class="k">Terminals</span><span class="v" style="color:var(--muted)">None</span></div>
      <div class="ov-row">${ic("globe", "sm ico")}<span class="k">Browser</span><span class="v" style="color:var(--muted)">No tabs</span></div></div>
    <div class="ov-sec"><div class="ov-row">${ic("gauge", "sm ico")}<span class="k">Usage</span><span class="v mono">12.4k tokens</span></div></div>`;
  if (t.projectId === null) return `<div class="ov" role="dialog" aria-label="Overview">
    <div class="ov-sec"><div class="ov-row">${ic("folder", "sm ico")}<span class="k">Folder</span><span class="v" style="color:var(--muted)">No project folder</span><button class="link" style="font-size:12px" data-copy="${esc(folderPath(t))}">Copy</button></div></div>${rest}</div>`;
  const p = project(t.projectId);
  const ev = moveEventOf(t);
  const earlier = ev && ev.kind === "existing" && ev.files.length && !S.sim.expired
    ? `<div class="ov-sec"><div class="ov-row">${ic("clock", "sm ico")}<span class="k">Earlier files</span><span class="v">${plural(ev.files.length, "file", "files")} · Mcode deletes ${DEADLINE}</span><button class="link" style="font-size:12px" data-copy="${esc(ev.oldFolder)}">Copy path</button></div></div>` : "";
  const where = t.mode === "local" || !p.git
    ? `<div class="ov-row">${ic("laptop", "sm ico")}<span class="k">Local</span><span class="v mono fade">${esc(p.path)}</span></div>`

/* ============================== Move actions ============================== */
function applyExisting(mv) {
  const lead = S.threads.find(x => x.id === mv.tid);
  const p = project(mv.pid);
  const oldFolder = folderPath(lead), files = [...folderFiles(lead)];
  const slug = suggestedName(lead);
  const branch = !p.git ? null : mv.mode === "local" ? p.branch : mv.mode === "newwt" ? `mcode/${slug}` : mv.wt.branch;
  const wtPath = mv.mode === "newwt" ? `~/src/mcode-wt/${slug}` : mv.mode === "existingwt" ? mv.wt.path : null;
  for (const o of sharersOf(lead)) {
    o.projectId = p.id; o.mode = p.git ? mv.mode : "local"; o.branch = branch; o.wtPath = wtPath;
    o.messages = [...o.messages, { ev: { kind: "existing", to: p.id, mode: o.mode, base: mv.base ?? p.branch, oldFolder, files, sent: false } }];
  }
  S.expanded = { ...S.expanded, [p.id]: true };
}
function applyNew(mv) {
  const lead = S.threads.find(x => x.id === mv.tid);
  const name = mv.name.trim();
  const id = "p" + S.nextId;
  const chip = name.split(/[-_. ]/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("") || name.slice(0, 2).toUpperCase();
  const p = { id, name, chip, c: "c2", path: joinPath(mv.parent, name), git: mv.git && !S.sim.failGit, branch: mv.git && !S.sim.failGit ? "main" : null, branches: ["main"], worktrees: [] };
  S.added = [p, ...S.added];
  S.nextId += 1;
  for (const o of sharersOf(lead)) {
    o.projectId = id; o.mode = "local"; o.branch = p.branch; o.wtPath = null;
    o.messages = [...o.messages, { ev: { kind: "new", to: id, files: [] } }];
  }
  S.expanded = { ...S.expanded, [id]: true };
  return id;
}
function runMove() {
  const mv = S.mv;
  setMv({ phase: "moving", picker: null });
  setTimeout(() => {
    if (S.overlay !== "move") return;
    if (S.sim.failMove || (S.sim.crossDrive && mv.dest === "new" && mv.parent.includes("\\"))) return setMv({ phase: "failed" });
    if (mv.dest === "existing") { applyExisting(mv); return set({ overlay: null, mv: null }); }
    const id = applyNew(mv);
    if (mv.git && S.sim.failGit) return setMv({ phase: "gitfailed", createdId: id });
    set({ overlay: null, mv: null });
  }, 1300);
}

}

function send() {

  const ev = moveEventOf(t);

  if (withNote) for (const o of S.threads) { const e = moveEventOf(o); if (e && e.oldFolder === ev.oldFolder) e.sent = true; }
  t.messages.push({ u: text }); t.status = "running"; draft = ""; render();

}

  if (d.tab) return set({ tab: d.tab });
  if (d.goto) { e.preventDefault(); return goto(d.goto); }
  if (d.sim) return set({ sim: { ...S.sim, [d.sim]: !S.sim[d.sim] } });
  if (d.hmenu) { e.stopPropagation(); const r = el.getBoundingClientRect(), a = document.getElementById("app").getBoundingClientRect(); return set({ overlay: S.overlay === "menu" ? null : "menu", menuFor: d.hmenu, menuXY: { x: r.left - a.left, y: r.bottom - a.top + 6 } }); }
  if (d.menu) { e.stopPropagation(); return set({ overlay: S.overlay === "menu" && S.menuFor === d.menu ? null : "menu", menuFor: d.menu, menuXY: null }); }
  if (d.open) return set({ screen: { kind: "thread", id: d.open }, overlay: null, ovOpen: false });
  if (d.toggle) return set({ expanded: { ...S.expanded, [d.toggle]: !S.expanded[d.toggle] } });
  if (d.scope) return set({ scope: d.scope });
  if (d.cmd) return d.cmd === "move" ? openMove(current().id) : set({ overlay: null });
  switch (d.act) {
    case "theme": return set({ theme: S.theme === "dark" ? "light" : "dark" });
    case "reset": draft = ""; return set({ ...initial(), tab: S.tab, theme: S.theme });
    case "palette": return set({ overlay: "palette", query: "" });
    case "cycleview": return set({ view: S.view === "threads" ? "projects" : "threads" });
    case "send": return send();
    case "ov": return set({ ovOpen: !S.ovOpen });
    case "openmove": return openMove(S.menuFor);
    case "mvcancel": if (e.target !== el && el.classList.contains("scrim")) return; return set({ overlay: null, mv: null });
    case "mvgo": return runMove();
    case "mvdone": return set({ overlay: null, mv: null });
    case "mvgitretry": { const p = project(S.mv.createdId); p.git = true; p.branch = "main"; for (const o of S.threads) if (o.projectId === p.id) o.branch = "main"; return set({ overlay: null, mv: null }); }
    case "flipprojects": return set({ hasProjects: !S.hasProjects });
    case "flipsharer": { const t = current(); const o = sharersOf(t)[1]; o.status = o.status === "running" ? "idle" : "running"; return render(); }
    case "dismiss": if (e.target.closest("[data-stop]")) return; return set({ overlay: null });
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.fk === "composer") { draft = e.target.value; autosize(e.target); e.target.closest(".composer").querySelector(".send").classList.toggle("ready", !!draft.trim()); }
  if (e.target.dataset.pq !== undefined) set({ query: e.target.value });
  if (e.target.dataset.mvq !== undefined) setMv({ pq: e.target.value });
  if (e.target.dataset.mvname !== undefined) setMv({ name: e.target.value });
});
/* The browser opens the details itself; keep state in step so a re-render keeps it open. toggle does not bubble. */
document.addEventListener("toggle", e => { if (e.target.dataset?.mvfiles !== undefined && S.mv) S.mv.showFiles = e.target.open; }, true);
document.addEventListener("keydown", e => {
  if (e.target.dataset.fk === "composer" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); return send(); }
  if (e.target.dataset.mvq !== undefined && e.key === "Enter") { e.preventDefault(); document.querySelector("[data-mvpick]")?.click(); return; }
  if (e.key === "Escape") {
    if (S.overlay === "move") { if (S.mv.phase === "moving" || S.mv.phase === "gitfailed") return; if (S.mv.picker) return setMv({ picker: null }); return set({ overlay: null, mv: null }); }
    if (S.overlay) return set({ overlay: null, query: "" });
    if (S.ovOpen) return set({ ovOpen: false });
  }
  if (S.tab !== "app") return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return set({ overlay: "palette", query: "" }); }
  if (e.key === "Enter" && S.overlay === "palette") { document.querySelector(".palette .mi:not([aria-disabled='true'])")?.click(); }
});
/* Drag feedback toggles classes in place: a re-render would remove the dragged row and cancel the drag. */
const dropTarget = e => {
  const head = e.target.closest?.("[data-drop]");
  const t = S.drag && S.threads.find(x => x.id === S.drag.tid);
  return head && t && !busySharer(t) ? head : null;
};
document.addEventListener("dragstart", e => {
  const row = e.target.closest?.("[draggable][data-open]");
  if (!row) return;
  S.drag = { tid: row.dataset.open };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", row.dataset.open);
  requestAnimationFrame(() => row.classList.add("dragging"));
});
document.addEventListener("dragover", e => {
  const head = dropTarget(e);
  document.querySelectorAll(".drop-over").forEach(h => h !== head && h.classList.remove("drop-over"));
  if (!head) return;
  e.preventDefault();
  head.classList.add("drop-over");
});
/* A drop never moves on its own: it opens the Move dialog with that project picked. */
document.addEventListener("drop", e => {
  const head = dropTarget(e);
  if (!head) return;
  e.preventDefault();
  openMove(S.drag.tid, { pid: head.dataset.drop, base: project(head.dataset.drop).branch });
});
document.addEventListener("dragend", () => {
  S.drag = null;
  document.querySelectorAll(".dragging, .drop-over").forEach(el => el.classList.remove("dragging", "drop-over"));
});
render();
</script>
</body>
</html>
