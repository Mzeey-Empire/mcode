name: CI

on:
  pull_request:
    branches: [main]
  # Nightly Main Tests dispatches this on main when main has moved, to answer
  # whether main passes its tests. A dispatched run runs only the test suites.
  workflow_dispatch:
    inputs:
      provider:
        description: Runner provider for this run (blacksmith, github, avrea, instabox or round-robin); empty uses CI_LINUX_RUNNER
        type: string
        default: ""

concurrency:
  # The provider is part of the key so dispatches on different providers don't cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.provider }}
  cancel-in-progress: true

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  # A workflow-level paths filter never starts the run, so Markdown-only PRs had
  # no Test or Typecheck to satisfy branch protection. This job decides instead,
  # and the heavy jobs skip, which counts as passing, only when every changed
  # file is Markdown at the root or under docs/. If it fails, its output is
  # empty and everything runs.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files')"
          # Old names too, so moving code into docs/ still counts as a code change.
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          listed="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' | wc -l)"
          docs_only=false
          # The files API stops at 3000 entries, so a short list proves nothing.
          if [ "$expected" -gt 0 ] && [ "$listed" -eq "$expected" ] \
            && ! printf '%s\n' "$files" | grep -Eqv '^[^/]+\.md$|^docs/.+\.md$'; then
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Markdown-only change: $docs_only ($listed of $expected files listed)" >> "$GITHUB_STEP_SUMMARY"

  # Rotates PR checks by PR number across CI_RUNNER_POOL, the providers that
  # still have free minutes. runner-pool.yml rewrites the pool every 30 minutes
  # and always keeps `github` in it, so a PR never waits on an exhausted
  # provider. Set the CI_LINUX_RUNNER repository variable to `blacksmith`,
  # `github`, `avrea` or `instabox` to pin every PR to one provider. A
  # dispatched run can override it with the `provider` input.
  pick-runner:
    name: Pick Runner
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      small: ${{ steps.pick.outputs.small }}
      large: ${{ steps.pick.outputs.large }}
    steps:
      - id: pick
        env:
          MODE: ${{ inputs.provider || vars.CI_LINUX_RUNNER || 'round-robin' }}
          # A dispatched run has no PR, so its run number picks the provider.
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          # Unset until runner-pool.yml first runs, and absent for fork PRs; GitHub alone is always safe.
          POOL: ${{ vars.CI_RUNNER_POOL || 'github' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            blacksmith|github|avrea|instabox) provider=$MODE ;;
            round-robin)
              IFS=, read -ra pool <<< "$POOL"
              provider=${pool[$((PR_NUMBER % ${#pool[@]}))]}
              case "$provider" in
                blacksmith|github|avrea) ;;
                *)
                  echo "::error::CI_RUNNER_POOL holds unknown provider '$provider': '$POOL'"
                  exit 1 ;;
              esac ;;
            *)
              echo "::error::CI_LINUX_RUNNER must be blacksmith, github, avrea, instabox or round-robin, got '$MODE'"
              exit 1 ;;
          esac
          case "$provider" in
            blacksmith)
              small=blacksmith-2vcpu-ubuntu-2404
              large=blacksmith-4vcpu-ubuntu-2404 ;;
            avrea)
              # Larger Avrea runners draw free minutes faster in proportion to their price.
              small=avrea-ubuntu-latest-2-vcpu
              large=avrea-ubuntu-latest-4-vcpu ;;
            instabox)
              # The free plan runs one 4 vCPU machine at a time, so these jobs queue one after another.
              small=instabox-medium
              large=instabox-medium ;;
            *)
              small=ubuntu-24.04
              large=ubuntu-24.04 ;;
          esac
          echo "small=$small" >> "$GITHUB_OUTPUT"
          echo "large=$large" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER ($MODE, pool $POOL) runs on $provider: $small, $large" >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    needs: [changes, pick-runner]
    # Skipped required checks count as passing, so skip only for Markdown-only changes and otherwise run and fail.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ needs.pick-runner.outputs.small || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Typecheck reads Electron's bundled types, not its binary; skip the binary
      # download and better-sqlite3 Electron prebuild so bun install does not flake
      # on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Require a runner choice
        if: needs.pick-runner.result != 'success'
        run: |
          echo "::error::Pick Runner failed, so this check did not run. Check the CI_LINUX_RUNNER repository variable."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typecheck-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    needs: [changes, pick-runner]
    # Skipped required checks count as passing, so skip only for Markdown-only changes and otherwise run and fail.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ needs.pick-runner.outputs.small || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Oxlint does not require Electron. Skip the binary download and rebuild during dependency install.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Require a runner choice
        if: needs.pick-runner.result != 'success'
        run: |
          echo "::error::Pick Runner failed, so this check did not run. Check the CI_LINUX_RUNNER repository variable."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:architecture
      # Non-blocking until the knip baseline in #2198 shrinks. A red step flags unreachable new code without failing the job.
      - run: bun run lint:deadcode
        continue-on-error: true

  # Server and web take nearly all of the test time, so each runs in two shards
  # on its own runner instead of after the other on one.
  # These are separate jobs, not a matrix: a run cancelled before a matrix
  # expands leaves a `Test ${{ matrix.suite }}` check that no later run
  # replaces, so the PR keeps a stray failure. Static names are replaced.
  test-packages:
    name: Test packages
    needs: [changes, pick-runner]
    # Skipped required checks count as passing, so skip only for Markdown-only changes and otherwise run and fail.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ needs.pick-runner.outputs.small || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUITE_ID: packages
      SUITE_ARGS: "--concurrency=1 --filter=!@mcode/server --filter=!mcode-frontend"
    steps: &test-suite-steps
      - name: Require a runner choice
        if: needs.pick-runner.result != 'success'
        run: |
          echo "::error::Pick Runner failed, so this check did not run. Check the CI_LINUX_RUNNER repository variable."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-test-${{ env.SUITE_ID }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ env.SUITE_ID }}-
      - run: bun install --frozen-lockfile
      # Every Vitest run sizes its worker pool to all cores, so parallel package
      # tasks oversubscribe the runner and starve timing-sensitive tests.
      # On GitHub Actions Turbo defaults to grouped logs, which hold a task's
      # output until it ends, so a one-task job prints nothing for minutes.
      # GitHub reads a `::error` annotation only at the start of a line, so
      # Turbo's task prefix would hide Vitest's failing-test annotations.
      # SUITE_ARGS is unquoted on purpose: it holds several arguments.
      - run: bun run test --log-order=stream --log-prefix=none $SUITE_ARGS

  test-server-1:
    name: Test server 1/2
    needs: [changes, pick-runner]
    # Skipped required checks count as passing, so skip only for Markdown-only changes and otherwise run and fail.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ needs.pick-runner.outputs.large || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUITE_ID: server-1
      SUITE_ARGS: "--filter=@mcode/server -- --shard=1/2"
    steps: *test-suite-steps

  test-server-2:
    name: Test server 2/2
    needs: [changes, pick-runner]
    # Skipped required checks count as passing, so skip only for Markdown-only changes and otherwise run and fail.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ needs.pick-runner.outputs.large || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUITE_ID: server-2
      SUITE_ARGS: "--filter=@mcode/server -- --shard=2/2"
    steps: *test-suite-steps

  test-web-1:
    name: Test web 1/2
    needs: [changes, pick-runner]
    # Skipped required checks count as passing, so skip only for Markdown-only changes and otherwise run and fail.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ needs.pick-runner.outputs.large || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUITE_ID: web-1
      SUITE_ARGS: "--filter=mcode-frontend -- --shard=1/2"
    steps: *test-suite-steps

  test-web-2:
    name: Test web 2/2
    needs: [changes, pick-runner]
    # Skipped required checks count as passing, so skip only for Markdown-only changes and otherwise run and fail.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ needs.pick-runner.outputs.large || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUITE_ID: web-2
      SUITE_ARGS: "--filter=mcode-frontend -- --shard=2/2"
    steps: *test-suite-steps

  # Branch protection requires `Test`. Each suite reports its own check, so
  # this job turns them into the single required check.
  test:
    name: Test
    needs: [changes, test-packages, test-server-1, test-server-2, test-web-1, test-web-2]
    # `always()`: a cancelled or skipped suite must still produce a failing check.
    if: ${{ always() }}
    # A few seconds of work is billed as a full Blacksmith minute.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every test suite to pass
        env:
          RESULTS: >-
            ${{ needs.test-packages.result }}
            ${{ needs.test-server-1.result }}
            ${{ needs.test-server-2.result }}
            ${{ needs.test-web-1.result }}
            ${{ needs.test-web-2.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          for result in $RESULTS; do
            if [ "$DOCS_ONLY" = true ] && [ "$result" = skipped ]; then continue; fi
            if [ "$result" != success ]; then
              echo "::error::A test suite finished with result '$result'."
              exit 1
            fi
          done
          if [ "$DOCS_ONLY" = true ]; then
            echo "Markdown-only change, so the test suites were skipped."
          fi

  build-check:
    name: Build Check
    needs: [changes, pick-runner]
    # Skipped required checks count as passing, so skip only for Markdown-only changes and otherwise run and fail.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ needs.pick-runner.outputs.small || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Require a runner choice
        if: needs.pick-runner.result != 'success'
        run: |
          echo "::error::Pick Runner failed, so this check did not run. Check the CI_LINUX_RUNNER repository variable."
          exit 1
      - uses: actions/checkout@v4
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Generate V8 snapshot
        run: bun apps/desktop/scripts/desktop-packaging/target-package/generate-snapshot.mjs

      - name: Smoke test server bundle
        run: bun apps/desktop/scripts/desktop-packaging/package-validation/smoke-test.mjs --bundle

      # Ubuntu 24.04 restricts unprivileged user namespaces, so Electron falls
      # back to its SUID sandbox helper, which must be root-owned with mode 4755.
      - name: Configure Electron sandbox helper
        shell: bash
        run: |
          sandbox="$(dirname "$(cd apps/desktop && node -p 'require("electron")')")/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      - name: Smoke launch desktop app
        timeout-minutes: 3
        env:
          # Regression guard: terminals inside Electron-based apps inherit this,
          # and prod-electron.mjs must strip it or main crashes at startup.
          ELECTRON_RUN_AS_NODE: "1"
        run: xvfb-run -a bun apps/desktop/scripts/desktop-packaging/package-validation/launch-smoke.mjs
