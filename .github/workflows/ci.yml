name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  # Splits PR checks between paid Blacksmith runners and free GitHub-hosted
  # runners by PR number parity, so each PR stays on one provider and keeps
  # warm caches. Set the CI_LINUX_RUNNER repository variable to `blacksmith`
  # or `github` to pin every PR to one provider.
  pick-runner:
    name: Pick Runner
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      small: ${{ steps.pick.outputs.small }}
      large: ${{ steps.pick.outputs.large }}
    steps:
      - id: pick
        env:
          MODE: ${{ vars.CI_LINUX_RUNNER || 'round-robin' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$MODE" in
            blacksmith) provider=blacksmith ;;
            github) provider=github ;;
            round-robin)
              if [ $((PR_NUMBER % 2)) -eq 0 ]; then provider=blacksmith; else provider=github; fi ;;
            *)
              echo "::error::CI_LINUX_RUNNER must be blacksmith, github or round-robin, got '$MODE'"
              exit 1 ;;
          esac
          if [ "$provider" = blacksmith ]; then
            small=blacksmith-2vcpu-ubuntu-2404
            large=blacksmith-4vcpu-ubuntu-2404
          else
            small=ubuntu-24.04
            large=ubuntu-24.04
          fi
          # Timing-sensitive tests fail on the noisier GitHub runners, so Test
          # stays on Blacksmith in round-robin until #2020 is fixed.
          if [ "$MODE" = round-robin ]; then
            large=blacksmith-4vcpu-ubuntu-2404
          fi
          echo "small=$small" >> "$GITHUB_OUTPUT"
          echo "large=$large" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER ($MODE) runs on $provider: $small, $large" >> "$GITHUB_STEP_SUMMARY"

  pr-title:
    name: PR Title
    # A few seconds of work is billed as a full Blacksmith minute.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Typecheck
    needs: pick-runner
    # Skipped required checks count as passing, so run and fail instead.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.pick-runner.outputs.small || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Typecheck reads Electron's bundled types, not its binary; skip the binary
      # download and better-sqlite3 Electron prebuild so bun install does not flake
      # on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Require a runner choice
        if: needs.pick-runner.result != 'success'
        run: |
          echo "::error::Pick Runner failed, so this check did not run. Check the CI_LINUX_RUNNER repository variable."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typecheck-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    needs: pick-runner
    # Skipped required checks count as passing, so run and fail instead.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.pick-runner.outputs.small || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Oxlint does not require Electron. Skip the binary download and rebuild during dependency install.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Require a runner choice
        if: needs.pick-runner.result != 'success'
        run: |
          echo "::error::Pick Runner failed, so this check did not run. Check the CI_LINUX_RUNNER repository variable."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:architecture

  test:
    name: Test
    needs: pick-runner
    # Skipped required checks count as passing, so run and fail instead.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.pick-runner.outputs.large || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Server tests launch Electron to load its runtime and native SQLite binding.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Require a runner choice
        if: needs.pick-runner.result != 'success'
        run: |
          echo "::error::Pick Runner failed, so this check did not run. Check the CI_LINUX_RUNNER repository variable."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-check:
    name: Build Check
    needs: pick-runner
    # Skipped required checks count as passing, so run and fail instead.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.pick-runner.outputs.small || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Require a runner choice
        if: needs.pick-runner.result != 'success'
        run: |
          echo "::error::Pick Runner failed, so this check did not run. Check the CI_LINUX_RUNNER repository variable."
          exit 1
      - uses: actions/checkout@v4
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Generate V8 snapshot
        run: bun apps/desktop/scripts/desktop-packaging/target-package/generate-snapshot.mjs

      - name: Smoke test server bundle
        run: bun apps/desktop/scripts/desktop-packaging/package-validation/smoke-test.mjs --bundle

      # Ubuntu 24.04 restricts unprivileged user namespaces, so Electron falls
      # back to its SUID sandbox helper, which must be root-owned with mode 4755.
      - name: Configure Electron sandbox helper
        shell: bash
        run: |
          sandbox="$(dirname "$(cd apps/desktop && node -p 'require("electron")')")/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      - name: Smoke launch desktop app
        timeout-minutes: 3
        env:
          # Regression guard: terminals inside Electron-based apps inherit this,
          # and prod-electron.mjs must strip it or main crashes at startup.
          ELECTRON_RUN_AS_NODE: "1"
        run: xvfb-run -a bun apps/desktop/scripts/desktop-packaging/package-validation/launch-smoke.mjs
