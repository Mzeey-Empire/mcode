name: Timing Experiment
on:
  pull_request:
    branches: [main]
jobs:
  timing:
    name: serial run ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure node-gyp headers
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test --concurrency=1 --force
