<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway, not production.

  Question: does treating thread startup as the first narration block
  (user message at transcript position + progress rows beneath it, ladder
  removed on completion, composer locked) feel right, across all startup
  contexts and failure modes?

  Scenarios are driven by a small pure state module (`createStartupModel`)
  mirroring the ThreadStartup contract shape. The DOM shell is disposable;
  the model is the part that could lift into the real feature.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype: narrative-native thread startup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --page: oklch(0.12 0.005 260);
    --bg: oklch(0.16 0.005 260);
    --card: oklch(0.19 0.005 260);
    --muted: oklch(0.22 0.005 260);
    --accent: oklch(0.24 0.005 260);
    --border: oklch(0.28 0.005 260);
    --control-border: oklch(0.50 0.01 260);
    --ink: oklch(0.93 0 0);
    --muted-ink: oklch(0.65 0.005 260);
    --primary: oklch(0.72 0.17 75);
    --primary-hover: oklch(0.68 0.17 75);
    --primary-ink: oklch(0.15 0.005 260);
    --ring: oklch(0.62 0.19 264);
    --link: oklch(0.7 0.14 260);
    --sage: oklch(0.78 0.13 145);
    --clay: oklch(0.78 0.13 25);
    --destructive: oklch(0.65 0.2 25);
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
    --radius-lg: 1rem;
    --radius-xl: 1.4rem;
    --ease-productive: cubic-bezier(0.25, 1, 0.5, 1);
    --ease-narrative: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 62.5%; }
  body {
    font-family: "Public Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 1.4rem;
    line-height: 1.6rem;
    background: var(--page);
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
  }

  .app { display: flex; height: 100%; }

  /* ---- Sidebar (mock, only for realism) ---- */
  .sidebar {
    width: 25.6rem;
    flex-shrink: 0;
    background: var(--bg);
    border-right: 1px solid var(--border);
    padding: 1.2rem 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }
  .sidebar .project {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--muted-ink);
    text-transform: none;
    padding: 0.4rem 0.8rem 0.8rem;
    letter-spacing: 0.01em;
  }
  .thread-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    height: 3.2rem;
    padding: 0 0.8rem;
    border-radius: 0.8rem;
    font-size: 1.3rem;
    color: var(--muted-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .thread-row.selected { background: var(--accent); color: var(--ink); }
  .thread-row .dot { flex-shrink: 0; }

  /* ---- Status dot ---- */
  .dot {
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    background: var(--muted-ink);
    position: relative;
  }
  .dot.running { background: var(--primary); }
  .dot.running::after {
    content: "";
    position: absolute;
    inset: -0.5rem;
    border-radius: 50%;
    background: color-mix(in oklch, var(--primary), transparent 85%);
    animation: statusPulse 1600ms var(--ease-productive) infinite;
  }
  .dot.settled { background: var(--sage); }
  .dot.failed { background: var(--clay); }
  .dot.pending { background: transparent; border: 1px solid var(--border); }
  @keyframes statusPulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* ---- Conversation pane ---- */
  .conversation {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--page);
  }
  .thread-header {
    height: 4.4rem;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0 1.6rem;
    border-bottom: 1px solid var(--border);
  }
  .thread-header .title {
    font-size: 1.4rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .thread-header .badge {
    font-size: 1.2rem;
    color: var(--muted-ink);
    background: var(--muted);
    border-radius: 0.6rem;
    padding: 0.2rem 0.8rem;
  }

  .transcript {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 2.4rem 1.6rem 1.6rem;
  }
  .measure { max-width: 76rem; margin: 0 auto; }

  /* User message — same block the real transcript will render */
  .user-message {
    background: var(--muted);
    border-radius: var(--radius-lg);
    padding: 1.2rem 1.6rem;
    font-size: 1.4rem;
    line-height: 2rem;
    color: var(--ink);
    max-width: 60rem;
    white-space: pre-wrap;
  }

  /* ---- Startup narration block ---- */
  .startup-block { margin-top: 2.4rem; }
  .startup-block.leaving {
    opacity: 0;
    transition: opacity 180ms var(--ease-productive);
  }

  .activity-line {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 1.3rem;
    color: var(--muted-ink);
    margin-bottom: 1.2rem;
    min-height: 1.6rem;
  }
  .activity-line .dot { margin-left: 0.3rem; }

  .steps { list-style: none; display: flex; flex-direction: column; }
  .step {
    display: flex;
    align-items: center;
    gap: 1rem;
    height: 3.2rem;
    color: var(--muted-ink);
    transition: color 180ms var(--ease-productive);
  }
  .step .dot { flex-shrink: 0; }
  .step .label { flex: 1; min-width: 0; }
  .step .elapsed {
    font-family: var(--mono);
    font-size: 1.2rem;
    font-variant-numeric: tabular-nums;
    color: var(--muted-ink);
    opacity: 0;
    transition: opacity 180ms var(--ease-productive);
  }
  .step.running { color: var(--ink); }
  .step.running .elapsed { opacity: 1; }
  .step.completed { color: var(--muted-ink); }
  .step.completed .elapsed { opacity: 0.7; }
  .step.failed { color: var(--clay); }
  .step.failed .elapsed { opacity: 1; }
  .step.blocked { color: var(--ink); }
  .step.blocked .elapsed { opacity: 1; }

  .step-detail {
    margin: -0.4rem 0 0.8rem 1.6rem;
    padding: 0.8rem 1.2rem;
    border-left: 1px solid var(--border);
    font-size: 1.3rem;
    color: var(--clay);
  }

  .startup-actions {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-top: 0.8rem;
    min-height: 3.2rem;
  }

  details.transcript-details { margin-top: 0.4rem; }
  details.transcript-details summary {
    cursor: pointer;
    font-size: 1.2rem;
    color: var(--muted-ink);
    width: fit-content;
    border-radius: 0.4rem;
  }
  details.transcript-details summary:hover { color: var(--ink); }
  .transcript-log {
    margin-top: 0.8rem;
    max-height: 20rem;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 0.8rem;
    background: var(--bg);
    padding: 1.2rem;
    font-family: var(--mono);
    font-size: 1.2rem;
    line-height: 1.8rem;
    color: var(--muted-ink);
    white-space: pre-wrap;
  }

  /* ---- Narration items that arrive after startup ---- */
  .narration-item {
    margin-top: 2.4rem;
    animation: fadeUp 240ms var(--ease-narrative) both;
  }
  .narration-item .tool-call {
    display: flex;
    align-items: center;
    gap: 1rem;
    height: 3.2rem;
    font-size: 1.3rem;
    color: var(--muted-ink);
  }
  .narration-item .prose {
    font-size: 1.4rem;
    line-height: 2.1rem;
    color: var(--ink);
    max-width: 68rem;
  }
  .narration-item .prose + .prose { margin-top: 1.2rem; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(0.6rem); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- Buttons ---- */
  .btn {
    height: 3.2rem;
    padding: 0 1.2rem;
    border-radius: var(--radius-lg);
    font: inherit;
    font-size: 1.4rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 120ms var(--ease-productive), border-color 120ms var(--ease-productive);
  }
  .btn:active { transform: translateY(1px); }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
  }
  .btn-ghost:hover { background: var(--muted); border-color: var(--control-border); }
  .btn-primary {
    background: var(--primary);
    color: var(--primary-ink);
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-destructive {
    background: var(--destructive);
    color: oklch(0.985 0 0);
  }
  .btn:disabled { opacity: 0.5; pointer-events: none; }
  .btn.sm { height: 2.8rem; font-size: 1.3rem; padding: 0 1rem; }

  /* ---- Composer (locked during startup) ---- */
  .composer-wrap {
    flex-shrink: 0;
    padding: 0.8rem 1.6rem 1.6rem;
  }
  .composer {
    max-width: 76rem;
    margin: 0 auto;
    background: var(--accent);
    border: 1px solid var(--control-border);
    border-radius: var(--radius-xl);
    padding: 1.2rem;
  }
  .composer textarea {
    width: 100%;
    resize: none;
    border: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 1.4rem;
    line-height: 2rem;
    outline: none;
  }
  .composer.locked textarea { opacity: 0.5; }
  .composer .composer-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.8rem;
  }
  .composer .lock-reason {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 1.2rem;
    color: var(--muted-ink);
  }
  .composer .send {
    width: 3.2rem;
    height: 3.2rem;
    border-radius: var(--radius-lg);
    border: none;
    background: var(--primary);
    color: var(--primary-ink);
    font-size: 1.6rem;
    cursor: pointer;
  }
  .composer .send:disabled { opacity: 0.5; pointer-events: none; }

  /* ---- Approval dialog ---- */
  .dialog-backdrop {
    position: fixed;
    inset: 0;
    background: oklch(0 0 0 / 0.5);
    display: grid;
    place-items: center;
    z-index: 40;
    animation: fadeIn 120ms var(--ease-productive) both;
  }
  .dialog {
    width: 44rem;
    background: var(--card);
    border: 1px solid var(--control-border);
    border-radius: var(--radius-xl);
    box-shadow: 0 4px 8px oklch(0 0 0 / 0.22);
    padding: 1.6rem;
  }
  .dialog h2 { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.8rem; }
  .dialog p { font-size: 1.4rem; color: var(--muted-ink); margin-bottom: 0.8rem; }
  .dialog code {
    font-family: var(--mono);
    font-size: 1.2rem;
    color: var(--ink);
    background: var(--muted);
    padding: 0.1rem 0.5rem;
    border-radius: 0.4rem;
  }
  .dialog .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.8rem;
    margin-top: 1.6rem;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---- Scenario switcher bar ---- */
  .scenario-bar {
    position: fixed;
    left: 1.6rem;
    bottom: 1.6rem;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: oklch(0.24 0.005 260);
    border: 1px solid var(--control-border);
    border-radius: 1.2rem;
    padding: 0.8rem 1.2rem;
    box-shadow: 0 8px 24px oklch(0 0 0 / 0.4);
    font-size: 1.2rem;
  }
  .scenario-bar .tag {
    font-family: var(--mono);
    font-size: 1rem;
    letter-spacing: 0.06em;
    color: var(--primary);
    border: 1px solid color-mix(in oklch, var(--primary), transparent 60%);
    border-radius: 0.6rem;
    padding: 0.2rem 0.6rem;
    text-transform: uppercase;
  }
  .scenario-bar select {
    font: inherit;
    font-size: 1.2rem;
    color: var(--ink);
    background: var(--muted);
    border: 1px solid var(--control-border);
    border-radius: 0.6rem;
    height: 2.8rem;
    padding: 0 0.6rem;
  }
  .scenario-bar .state-readout {
    font-family: var(--mono);
    font-size: 1.1rem;
    color: var(--muted-ink);
    min-width: 18rem;
    text-align: right;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0ms !important; transition-duration: 0ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Project threads (mock)">
    <div class="project">mcode</div>
    <div class="thread-row"><span class="dot settled"></span>Fix workspace file refresh</div>
    <div class="thread-row selected" id="sidebar-row"><span class="dot running" id="sidebar-dot"></span><span id="sidebar-title">Add keyboard shortcut help</span></div>
    <div class="thread-row"><span class="dot"></span>Spike: lazy diff loading</div>
  </aside>

  <main class="conversation">
    <header class="thread-header">
      <div class="title"><span id="header-title">Add keyboard shortcut help</span><span class="badge">mcode</span></div>
    </header>

    <div class="transcript" id="transcript">
      <div class="measure">
        <div class="user-message" id="user-message">Add a keyboard shortcut help overlay so users can discover bindings.</div>
        <section class="startup-block" id="startup-block" aria-label="Thread startup">
          <div class="activity-line" role="status" aria-live="polite">
            <span class="dot running" id="activity-dot"></span>
            <span id="activity-text">Creating a worktree</span>
          </div>
          <ol class="steps" id="steps"></ol>
          <div id="step-detail-slot"></div>
          <details class="transcript-details" id="transcript-details">
            <summary>More details</summary>
            <div class="transcript-log" id="transcript-log" role="log" aria-live="polite">Waiting for startup output…</div>
          </details>
          <div class="startup-actions" id="startup-actions"></div>
        </section>
        <div id="narration-slot"></div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer locked" id="composer">
        <textarea id="composer-input" rows="1" disabled placeholder=""></textarea>
        <div class="composer-footer">
          <span class="lock-reason" id="lock-reason"></span>
          <button class="send" id="send-btn" disabled aria-label="Send">↑</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="dialog-slot"></div>

<div class="scenario-bar" role="toolbar" aria-label="Prototype scenario controls">
  <span class="tag">prototype</span>
  <label>Context <select id="context-select">
    <option value="managed-worktree">New worktree</option>
    <option value="attached-worktree">Existing worktree</option>
    <option value="direct">Local</option>
    <option value="pull-request-review">PR review</option>
  </select></label>
  <label>Scenario <select id="scenario-select">
    <option value="happy">Happy path</option>
    <option value="slow">Slow checkout</option>
    <option value="approval">Blocked: setup approval</option>
    <option value="failure">Setup fails → retry</option>
    <option value="cancel">Cancel mid-run</option>
  </select></label>
  <button class="btn sm btn-primary" id="run-btn">Run</button>
  <button class="btn sm btn-ghost" id="step-btn">Step</button>
  <button class="btn sm btn-ghost" id="reset-btn">Reset</button>
  <span class="state-readout" id="state-readout">idle</span>
</div>

<script>
"use strict";

/* ============================================================
 * Pure startup model — mirrors ThreadStartup contract shape.
 * No DOM access below this line.
 * ============================================================ */

const CONTEXTS = {
  "managed-worktree": {
    steps: [
      { phase: "worktree", label: "Prepare checkout" },
      { phase: "setup", label: "Run project setup" },
      { phase: "agent", label: "Start agent" },
    ],
    activity: { worktree: "Creating a worktree", setup: "Running project setup", agent: "Starting agent" },
    log: {
      worktree: ["git worktree add .mcode/worktrees/mcode/keys-a3f9 -b mcode-a3f9c2d1", "checkout complete: 214 files"],
      setup: ["$ bun run setup:project", "installing deps…", "fixture ready"],
      agent: ["spawning claude --session …", "session attached"],
    },
  },
  "attached-worktree": {
    steps: [
      { phase: "thread", label: "Attach existing checkout" },
      { phase: "agent", label: "Start agent" },
    ],
    activity: { thread: "Attaching checkout", agent: "Starting agent" },
    log: {
      thread: ["attaching .mcode/worktrees/mcode/feature-x", "checkout verified"],
      agent: ["spawning claude --session …", "session attached"],
    },
  },
  "direct": {
    steps: [
      { phase: "thread", label: "Use project checkout" },
      { phase: "agent", label: "Start agent" },
    ],
    activity: { thread: "Creating a thread", agent: "Starting agent" },
    log: {
      thread: ["using /Users/dev/mcode", "git state clean"],
      agent: ["spawning claude --session …", "session attached"],
    },
  },
  "pull-request-review": {
    steps: [
      { phase: "thread", label: "Load pull request" },
      { phase: "worktree", label: "Prepare review checkout" },
      { phase: "agent", label: "Start agent" },
    ],
    activity: { thread: "Loading pull request", worktree: "Preparing review checkout", agent: "Starting agent" },
    log: {
      thread: ["fetching PR #482 metadata", "base: main, head: feat/preview-tabs"],
      worktree: ["git worktree add .mcode/reviews/pr-482 pr-482-head", "checkout complete"],
      agent: ["spawning claude --session …", "session attached"],
    },
  },
};

function createStartupModel(context) {
  const ctx = CONTEXTS[context];
  return {
    context,
    state: "running",           // running | blocked | failed | cancelled | completed
    cancellation: "none",
    activeStep: 0,
    steps: ctx.steps.map((s, i) => ({
      phase: s.phase,
      label: s.label,
      state: i === 0 ? "running" : "pending",
      elapsedMs: 0,
      error: null,
    })),
    transcript: [],
    narration: [],
  };
}

function modelTick(model, ms) {
  const step = model.steps[model.activeStep];
  if (model.state === "running" && step && step.state === "running") {
    step.elapsedMs += ms;
  }
}

function modelLog(model, line) { model.transcript.push(line); }

function modelAdvanceStep(model) {
  const step = model.steps[model.activeStep];
  if (!step) return;
  step.state = "completed";
  model.activeStep += 1;
  const next = model.steps[model.activeStep];
  if (next) next.state = "running";
  else model.state = "completed";
}

function modelBlock(model, reason) {
  model.state = "blocked";
  model.steps[model.activeStep].state = "blocked";
  model.steps[model.activeStep].error = reason;
}

function modelFail(model, reason) {
  model.state = "failed";
  model.steps[model.activeStep].state = "failed";
  model.steps[model.activeStep].error = reason;
}

function modelResume(model) {
  model.state = "running";
  model.steps[model.activeStep].state = "running";
  model.steps[model.activeStep].error = null;
}

function modelCancel(model) {
  model.cancellation = "requested";
}

function modelCancelled(model) {
  model.state = "cancelled";
  model.steps.forEach((s) => { if (s.state === "running" || s.state === "pending") s.state = "cancelled"; });
}

function modelActivity(model) {
  if (model.state === "cancelled") return "Startup cancelled";
  if (model.cancellation === "requested") return "Cancelling startup";
  if (model.state === "blocked") return "Setup needs approval";
  if (model.state === "failed") return "Startup failed";
  if (model.state === "completed") return "";
  const step = model.steps[model.activeStep];
  return CONTEXTS[model.context].activity[step?.phase] ?? "Starting";
}

/* ============================================================
 * Scenario scripts — ordered lists of timed actions.
 * ============================================================ */

const SCENARIOS = {
  happy: {
    durations: [1400, 2600, 1800],
    script: (ctx) => [
      ...defaultSteps(ctx),
    ],
  },
  slow: {
    script: (ctx) => {
      const steps = defaultSteps(ctx);
      // stretch the first step
      const i = steps.findIndex((s) => s.type === "advance");
      steps.splice(i, 0, { type: "wait", ms: 5200 });
      return steps;
    },
  },
  approval: {
    script: (ctx) => {
      const steps = [];
      const setupIdx = CONTEXTS[ctx].steps.findIndex((s) => s.phase === "setup");
      for (let i = 0; i < CONTEXTS[ctx].steps.length; i++) {
        const phase = CONTEXTS[ctx].steps[i].phase;
        steps.push({ type: "log", phase });
        if (i === setupIdx) {
          steps.push({ type: "wait", ms: 1200 });
          steps.push({ type: "block", reason: "Project setup wants to run: bun run setup:project" });
          // waits for user action (approve)
        } else {
          steps.push({ type: "wait", ms: 1200 + i * 400 });
          steps.push({ type: "advance" });
        }
      }
      steps.push({ type: "finish" });
      return steps;
    },
  },
  failure: {
    script: (ctx) => {
      const steps = [];
      const setupIdx = CONTEXTS[ctx].steps.findIndex((s) => s.phase === "setup");
      const failIdx = setupIdx === -1 ? CONTEXTS[ctx].steps.length - 1 : setupIdx;
      for (let i = 0; i < CONTEXTS[ctx].steps.length; i++) {
        const phase = CONTEXTS[ctx].steps[i].phase;
        steps.push({ type: "log", phase });
        if (i === failIdx) {
          steps.push({ type: "wait", ms: 1600 });
          steps.push({ type: "fail", reason: "bun run setup:project exited 1 — missing .env.local" });
          // waits for user action (retry / continue)
        } else {
          steps.push({ type: "wait", ms: 1100 + i * 400 });
          steps.push({ type: "advance" });
        }
      }
      steps.push({ type: "finish" });
      return steps;
    },
  },
  cancel: {
    script: (ctx) => [
      { type: "log", phase: CONTEXTS[ctx].steps[0].phase },
      { type: "wait", ms: 900 },
      // pauses here; user presses Cancel, then it resolves to cancelled
      { type: "awaitCancel" },
      { type: "cancelled" },
    ],
  },
};

function defaultSteps(ctx) {
  const steps = [];
  CONTEXTS[ctx].steps.forEach((s, i) => {
    steps.push({ type: "log", phase: s.phase });
    steps.push({ type: "wait", ms: 1300 + i * 500 });
    steps.push({ type: "advance" });
  });
  steps.push({ type: "finish" });
  return steps;
}

/* ============================================================
 * Page shell — renders model into DOM. Throwaway.
 * ============================================================ */

const $ = (id) => document.getElementById(id);
let model = null;
let scriptQueue = [];
let scriptIndex = 0;
let timer = null;
let runTimer = null;
let awaitingCancel = false;

const NARRATION = [
  { kind: "tool", text: "Read  apps/web/src/features/shortcuts" },
  { kind: "tool", text: "Grep  \"ShortcutHelp|keybinding\"" },
  { kind: "prose", text: "I'll add a shortcut help overlay. The shortcut registry already lives in `lib/shortcuts.ts`, so the overlay can derive its rows instead of duplicating bindings." },
  { kind: "tool", text: "Edit  components/chat/ShortcutHelpOverlay.tsx" },
  { kind: "prose", text: "Overlay mounts at the app shell layer, bound to `?` and `Ctrl+/`. Listing the grouped bindings now." },
];

function setReadout(text) { $("state-readout").textContent = text; }

function render() {
  if (!model) return;
  renderSteps();
  renderActivity();
  renderActions();
  renderComposer();
  renderSidebar();
  const parts = [`state=${model.state}`, `step=${model.activeStep + 1}/${model.steps.length}`];
  if (model.cancellation !== "none") parts.push(`cancel=${model.cancellation}`);
  setReadout(parts.join("  "));
}

function renderSteps() {
  const ol = $("steps");
  ol.innerHTML = "";
  model.steps.forEach((step) => {
    const li = document.createElement("li");
    li.className = `step ${step.state}`;
    const dot = document.createElement("span");
    dot.className = `dot ${step.state === "completed" ? "settled" : step.state === "failed" ? "failed" : step.state === "blocked" ? "failed" : step.state === "running" ? "running" : "pending"}`;
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = step.label;
    const elapsed = document.createElement("span");
    elapsed.className = "elapsed";
    elapsed.textContent = formatMs(step.elapsedMs);
    li.append(dot, label, elapsed);
    ol.appendChild(li);
    if (step.error && (step.state === "failed" || step.state === "blocked")) {
      const detail = document.createElement("div");
      detail.className = "step-detail";
      detail.textContent = step.error;
      ol.appendChild(detail);
    }
  });
}

function renderActivity() {
  const text = modelActivity(model);
  $("activity-text").textContent = text;
  $("activity-dot").className = `dot ${model.state === "running" || model.cancellation === "requested" ? "running" : model.state === "failed" || model.state === "blocked" ? "failed" : model.state === "cancelled" ? "pending" : "settled"}`;
  $("activity-dot").style.visibility = text ? "visible" : "hidden";
}

function renderActions() {
  const slot = $("startup-actions");
  slot.innerHTML = "";
  if (model.state === "failed") {
    slot.append(
      makeBtn("Retry setup", "btn-ghost", () => resumeScript("retry")),
      makeBtn("Continue without setup", "btn-ghost", () => resumeScript("continue")),
    );
  }
  if ((model.state === "running" || model.state === "blocked") && model.cancellation === "none") {
    slot.append(makeBtn("Cancel", "btn-destructive sm", () => userCancel()));
  }
  if (model.state === "cancelled") {
    const note = document.createElement("span");
    note.style.color = "var(--muted-ink)";
    note.style.fontSize = "1.3rem";
    note.textContent = "Startup cancelled. The thread was not created.";
    slot.append(note, makeBtn("Start over", "btn-ghost", () => resetAll()));
  }
}

function renderComposer() {
  const locked = model.state !== "completed";
  $("composer").classList.toggle("locked", locked);
  $("composer-input").disabled = locked;
  $("send-btn").disabled = locked;
  const reason = $("lock-reason");
  if (locked) {
    reason.innerHTML = "";
    const dot = document.createElement("span");
    dot.className = "dot running";
    const txt = document.createElement("span");
    txt.textContent = model.state === "cancelled" ? "Startup cancelled" : "Waiting for agent to start";
    reason.append(dot, txt);
  } else {
    reason.textContent = "";
  }
}

function renderSidebar() {
  const dot = $("sidebar-dot");
  dot.className = `dot ${model.state === "completed" ? "running" : model.state === "running" ? "running" : model.state === "failed" || model.state === "blocked" ? "failed" : "pending"}`;
}

function makeBtn(label, variant, onClick) {
  const b = document.createElement("button");
  b.className = `btn sm ${variant}`;
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

function formatMs(ms) {
  if (ms < 1000) return `${Math.round(ms / 100) / 10}s`;
  return `${(ms / 1000).toFixed(1)}s`;
}

/* ---- script execution ---- */

function runScript(ctx, scenario) {
  resetAll();
  model = createStartupModel(ctx);
  scriptQueue = SCENARIOS[scenario].script(ctx);
  scriptIndex = 0;
  awaitingCancel = false;
  render();
  startTicking();
  pumpScript();
}

function startTicking() {
  stopTicking();
  runTimer = setInterval(() => {
    if (model && model.state === "running") {
      modelTick(model, 200);
      renderSteps();
    }
  }, 200);
}
function stopTicking() { if (runTimer) clearInterval(runTimer); runTimer = null; }

function pumpScript() {
  if (!model || scriptIndex >= scriptQueue.length) return;
  const action = scriptQueue[scriptIndex];
  switch (action.type) {
    case "log":
      (CONTEXTS[model.context].log[action.phase] ?? []).forEach((l) => modelLog(model, l));
      renderTranscriptLog();
      scriptIndex++;
      pumpScript();
      break;
    case "wait":
      if (stepMode) {
        // In step mode a wait pauses; the next Step click skips it.
        scriptIndex++;
        render();
        break;
      }
      timer = setTimeout(() => { scriptIndex++; pumpScript(); }, action.ms);
      break;
    case "advance":
      modelAdvanceStep(model);
      render();
      scriptIndex++;
      pumpScript();
      break;
    case "block":
      modelBlock(model, action.reason);
      render();
      showApprovalDialog(action.reason);
      // script pauses until user approves
      break;
    case "fail":
      modelFail(model, action.reason);
      render();
      // script pauses until user retries/continues
      break;
    case "awaitCancel":
      awaitingCancel = true;
      break;
    case "cancelled":
      modelCancelled(model);
      render();
      scriptIndex++;
      pumpScript();
      break;
    case "finish":
      finishStartup();
      break;
  }
}

function resumeScript(choice) {
  if (choice === "retry") {
    modelResume(model);
    modelLog(model, "retrying setup…");
    renderTranscriptLog();
    render();
    timer = setTimeout(() => {
      modelAdvanceStep(model);
      scriptIndex++;
      render();
      pumpScript();
    }, 1800);
  } else {
    // continue without setup: mark step skipped, move on
    const step = model.steps[model.activeStep];
    step.state = "completed";
    step.error = null;
    modelLog(model, "setup skipped by user");
    model.state = "running";
    model.activeStep++;
    const next = model.steps[model.activeStep];
    if (next) next.state = "running";
    renderTranscriptLog();
    render();
    scriptIndex++;
    timer = setTimeout(() => pumpScript(), 1400);
  }
}

function userCancel() {
  if (!model) return;
  modelCancel(model);
  render();
  if (awaitingCancel) {
    awaitingCancel = false;
    scriptIndex++;
    timer = setTimeout(() => pumpScript(), 800);
  } else {
    timer = setTimeout(() => {
      modelCancelled(model);
      render();
      stopScript();
    }, 900);
  }
}

function showApprovalDialog(reason) {
  const slot = $("dialog-slot");
  slot.innerHTML = "";
  const backdrop = document.createElement("div");
  backdrop.className = "dialog-backdrop";
  backdrop.innerHTML = `
    <div class="dialog" role="dialog" aria-modal="true" aria-label="Approve project setup">
      <h2>Approve project setup</h2>
      <p>This project wants to run a setup command before the agent starts:</p>
      <p><code>bun run setup:project</code></p>
      <p>The command runs inside the managed worktree.</p>
      <div class="dialog-actions">
        <button class="btn sm btn-ghost" id="dlg-cancel">Cancel</button>
        <button class="btn sm btn-primary" id="dlg-approve">Approve and run</button>
      </div>
    </div>`;
  slot.appendChild(backdrop);
  $("dlg-approve").onclick = () => {
    slot.innerHTML = "";
    modelResume(model);
    modelLog(model, "setup approved — running bun run setup:project");
    modelLog(model, "fixture ready");
    renderTranscriptLog();
    render();
    timer = setTimeout(() => {
      modelAdvanceStep(model);
      scriptIndex++;
      render();
      pumpScript();
    }, 1600);
  };
  $("dlg-cancel").onclick = () => { slot.innerHTML = ""; userCancel(); };
}

function finishStartup() {
  // ladder leaves entirely; narration takes over
  const block = $("startup-block");
  block.classList.add("leaving");
  stopTicking();
  setTimeout(() => { block.style.display = "none"; }, 200);
  let i = 0;
  const emit = () => {
    if (i >= NARRATION.length) return;
    const item = NARRATION[i++];
    const div = document.createElement("div");
    div.className = "narration-item";
    div.innerHTML = item.kind === "tool"
      ? `<div class="tool-call"><span class="dot settled"></span><span style="font-family:var(--mono);font-size:1.2rem">${item.text}</span></div>`
      : `<div class="prose">${item.text}</div>`;
    $("narration-slot").appendChild(div);
    $("transcript").scrollTop = $("transcript").scrollHeight;
    setTimeout(emit, item.kind === "tool" ? 700 : 1100);
  };
  setTimeout(emit, 300);
}

function renderTranscriptLog() {
  $("transcript-log").textContent = model.transcript.length ? model.transcript.join("\n") : "Waiting for startup output…";
}

function stopScript() {
  if (timer) clearTimeout(timer);
  timer = null;
}

function resetAll() {
  stopScript();
  stopTicking();
  $("dialog-slot").innerHTML = "";
  $("narration-slot").innerHTML = "";
  $("steps").innerHTML = "";
  $("step-detail-slot").innerHTML = "";
  $("startup-actions").innerHTML = "";
  $("transcript-log").textContent = "";
  const block = $("startup-block");
  block.style.display = "";
  block.classList.remove("leaving");
  $("activity-text").textContent = "";
  $("activity-dot").style.visibility = "hidden";
  $("composer").classList.add("locked");
  $("composer-input").disabled = true;
  $("send-btn").disabled = true;
  $("lock-reason").innerHTML = "";
  $("sidebar-dot").className = "dot pending";
  model = null;
  awaitingCancel = false;
  setReadout("idle");
}

/* ---- step-through mode: pump advances one action per click ---- */
let stepMode = false;
$("run-btn").onclick = () => {
  stepMode = false;
  runScript($("context-select").value, $("scenario-select").value);
};
$("step-btn").onclick = () => {
  if (!model || scriptIndex >= scriptQueue.length) {
    stepMode = true;
    runScript($("context-select").value, $("scenario-select").value);
    stopScript(); // freeze after first pump batch
    return;
  }
  if (stepMode) pumpScript();
};
$("reset-btn").onclick = resetAll;

resetAll();
</script>
</body>
</html>
